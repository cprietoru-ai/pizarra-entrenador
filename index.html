  if(t.id==="jgBorrar"){S.delConfirm="jg";render();return}
  if(t.id==="jgBorrarNo"){S.delConfirm=null;render();return}
  if(t.id==="jgBorrarSi"){S.jgEd=false;clearTimeout(jgTimer);if(S.jgId&&S.jug[S.jgId]){delete S.jug[S.jgId];jugGuardar()}try{localStorage.removeItem(JG_ABIERTA)}catch(e){}S.delConfirm=null;S.view="jug";render();toast("Jugada borrada");return}
  if(t.id==="jgGif"){leerJg();S.jgVelMenu=false;t.disabled=true;t.classList.add("cargando");toast("Preparando la animación…");
    try{const blob=await grabarGif();if(!blob){render();return}
      const nombre=slugPA(j.nombre||"jugada")+".gif",f=new File([blob],nombre,{type:"image/gif"});
      if(navigator.canShare&&navigator.canShare({files:[f]})){try{await navigator.share({files:[f],title:j.nombre||"Jugada"});render();return}catch(e){if(e&&e.name==="AbortError"){render();return}}}
      S.img={blob,url:URL.createObjectURL(blob),nombre}}  // sin menú de compartir directo: se enseña con su botón
    catch(e){toast("No se pudo hacer la animación")}render();return}
  if(t.id==="jgCerrar"){URL.revokeObjectURL(S.img.url);S.img=null;render();return}
  if(t.id==="jgBajar"){bajarBlob(S.img.blob,S.img.nombre);return}
  if(t.id==="jgCompartir"){try{const f=new File([S.img.blob],S.img.nombre,{type:S.img.blob.type});
      if(navigator.canShare&&navigator.canShare({files:[f]})){await navigator.share({files:[f]});return}}catch(e){if(e&&e.name==="AbortError")return}
    bajarBlob(S.img.blob,S.img.nombre);toast("Descargado");return}
});
app.addEventListener("change",ev=>{const t=ev.target;if(S.view!=="jugEdit")return;const j=S.jgDraft;
  if(t.id==="jg-partido"){leerJg();autoGuardarJg();render();const pj=j.partido&&S.eq.partidos[j.partido];toast(pj?`Jugada para la J${pj.jornada} · ${pj.rival}`:"Sin partido");return}
  if(t.id==="jg-campo"){leerJg();jgSnap();j.campo=t.value;const [w,h]=jugDims(j);for(const p of j.pasos){for(const id in p.pos){const q=p.pos[id];p.pos[id]=[Math.min(w,q[0]),Math.min(h,q[1])]}}render();return}
  if(t.id==="jg-lab"){const f=j.fichas.find(x=>x.id===S.jgSel);if(f){const v=t.value.trim();
    if(labUsado(j,f,v)){toast(`El ${v} ya está en el campo: elige otro`);t.value=f.lab||"";return}jgSnap();f.lab=v;redibujarJg()}return}
  if(t.id==="jg-labpl"&&t.value){const f=j.fichas.find(x=>x.id===S.jgSel);if(f){f.lab=t.value;const i=$("#jg-lab");if(i)i.value=t.value;redibujarJg()}return}
});
app.addEventListener("input",ev=>{if(ev.target.id==="jgQ"&&S.view==="jug"){S.jgQ=ev.target.value;const pos=ev.target.selectionStart;render();const i=$("#jgQ");if(i){i.focus();i.setSelectionRange(pos,pos)}return}
  if(ev.target.id==="jgdTexto")S.jgdTexto=ev.target.value;if(ev.target.id==="jgSig")S.jgSig=ev.target.value;
  if(S.view==="jugEdit"&&ev.target.id==="jg-nombre"){S.jgDraft.nombre=ev.target.value.trim();autoGuardarJg()}});
app.addEventListener("keydown",ev=>{if(ev.key==="Enter"&&(ev.target.id==="jg-nombre"||ev.target.id==="jg-lab")){ev.preventDefault();ev.target.blur();if(ev.target.id==="jg-lab"){S.jgSel=null;render()}}});
app.addEventListener("input",ev=>{if(S.view==="jugEdit"&&ev.target.id==="jg-texto"){S.jgDraft.pasos[S.jgPaso].texto=ev.target.value;autoGuardarJg();const tx=$("#jgtexto");if(tx)tx.textContent=ev.target.value}});

// ---------- Manual de uso (1.18) ----------
// Secciones que se abren y se cierran, con apartados dentro. El texto admite <b>, <i> y listas.
const MANUAL=[
 {ic:"🚀",t:"Primeros pasos",r:"Instalar la app, conectar tu equipo y saber qué versión tienes.",a:[
  ["Instalarla en el móvil",`<ul><li><b>Android (Chrome):</b> menú ⋮ → «Instalar aplicación».</li><li><b>iPhone:</b> ábrela en <b>Safari</b> (no en Brave ni dentro de WhatsApp) → botón Compartir (cuadrado con flecha) → «Añadir a pantalla de inicio».</li><li>Queda un icono como cualquier app y funciona sin cobertura en el campo.</li></ul>`],
  ["Conectar tu equipo",`En <b>Mi club → Mi equipo</b> pon el <b>código del equipo</b> y la <b>contraseña</b> que te ha dado el club. Una sola vez: desde entonces te llegan solos la plantilla con fotos, el calendario, los resultados, los goleadores y la clasificación.`],
  ["Qué versión tengo y qué hay de nuevo",`Arriba, debajo del nombre, pone <b>v1.x</b>. Toca el botón <b>?</b> de arriba a la derecha → <b>✨ Novedades</b>: ahí está lo nuevo de cada versión (sale un punto amarillo cuando hay algo sin ver). Las versiones nuevas llegan solas al abrir la app con cobertura; si no la ves, ciérrala y ábrela otra vez.`],
  ["En el ordenador",`En una pantalla grande la jugada se ve en dos columnas: el campo a la izquierda, entero sin bajar, y a la derecha las fichas, los pasos y el cuadro de texto. La rueda del ratón mueve la línea de pasos y la lista de jugadores.`],
  ["Modo claro y oscuro",`Toca el <b>☀️/🌙</b> de arriba, al lado del <b>?</b>, para cambiar entre claro y oscuro. Se queda guardado en el móvil.`],
  ["Las pestañas",`<ul><li><b>Pizarra:</b> jugadas animadas para la charla.</li><li><b>Ejercicios:</b> tu biblioteca de ejercicios dibujados.</li><li><b>Entrenos:</b> el 📅 calendario de entrenos y las 📚 sesiones.</li><li><b>Partidos:</b> convocatoria, alineación, resultado, informe del rival, clasificación y estadísticas.</li><li><b>Mi club:</b> tu club, tu equipo, copias e instalar.</li><li><b>Botón ? (arriba a la derecha):</b> este manual y las novedades, desde cualquier pestaña.</li></ul>`]]},
 {ic:"🎬",t:"Pizarra: jugadas animadas",r:"Jugadas paso a paso con carreras, conducciones y pases, para enseñarlas y compartirlas.",a:[
  ["La lista de jugadas",`Igual que Ejercicios y Sesiones: tarjetas, grupos que se abren y se cierran, buscador y filtros.<ul><li><b>⭐ Próximo partido</b>, destacado arriba: el siguiente partido del calendario y las jugadas que tienen su 📅. Cambia solo cuando ese partido pasa.</li><li><b>🛠 En preparación</b>: las que aún tienen un solo paso o el nombre que pone la app. Cuando tengan dos pasos y nombre, pasan a su tipo.</li><li><b>Por tipo</b>: balón parado, salida de balón, presión y defensa, transiciones y ataque, según el nombre y lo que pasa en los pasos.</li><li><b>Filtros</b>: por partido (para ver las de cualquier jornada) y por campo.</li></ul>El <b>⋯</b> de cada tarjeta duplica la jugada (para hacer una variante) o la borra sin abrirla.`],
  ["Crear una jugada",`<b>+ Nueva</b>, o abre una de <b>Para empezar</b> (córner, falta, salida de balón, presión) o <b>Del club</b> y cámbiala a tu gusto. Arriba, <b>toca el título</b> para ponerle nombre. El campo (entero, medio campo, área o F7) se cambia con el botón de la <b>esquina de arriba a la izquierda del campo</b> (lleva «F11», «½», «Área» o «F7»). Arriba a la derecha, a la altura de «← Pizarra»: <b>📅</b> para decir para qué partido es (sale «J6» en el icono), <b>💾</b> para guardar (el punto se pone verde cuando está guardada; también se guarda sola) y <b>🗑</b> para borrar la jugada, o descartarla si aún no estaba guardada (pregunta antes).`],
  ["Poner y mover fichas",`<ul><li>Elige <b>Nuestro</b>, <b>Portero</b>, <b>Rival</b>, <b>Portero rival</b> o <b>Balón</b> en la fila de encima del campo y toca el campo.</li><li>Con <b>Mover</b>, arrastra con un dedo. Si sueltas el balón encima de un jugador, se le pega.</li><li><b>Subir y bajar la pantalla:</b> con <b>Mover</b>, desliza empezando en el césped (no encima de una ficha). Con las demás fichas elegidas, el campo se queda quieto para que no se te escape nada.</li><li><b>Toca una ficha</b> sin arrastrarla: sale su menú justo encima, con su número, los jugadores de tu plantilla para elegir con un toque, <b>🗑</b> para quitarla y <b>✓</b> para cerrar.</li><li><b>Sin dorsales repetidos:</b> en cada equipo no puede haber dos fichas con el mismo número. Los jugadores que ya están en el campo salen apagados («en el campo») y una ficha nueva coge el primer número libre.</li></ul>`],
  ["Los pasos",`Una jugada es una serie de pasos. Debajo del campo está el reproductor (⏮ ◀ ▶ ▶) y la <b>línea de pasos</b>: toca un número para ir a ese paso (con muchos pasos, la línea se desliza con el dedo y se centra sola en el paso en el que estás), <b>+</b> copia el paso actual (luego arrastras las fichas a donde van) y <b>🗑</b> borra el paso en el que estás. <b>⛶</b> pone el campo a pantalla completa para la charla. La app dibuja sola lo que pasa entre un paso y otro:<ul><li><b>Línea amarilla:</b> carrera sin balón.</li><li><b>Línea azul ondulada:</b> conducción (se mueve con el balón).</li><li><b>Línea blanca discontinua:</b> pase.</li></ul>En el cuadro de abajo escribes qué pasa en ese paso: sale en la charla y al compartir.`],
  ["👥 Colocar equipos y jugadas predefinidas",`Botón <b>👥</b> de la <b>esquina de arriba a la derecha del campo</b>. Sube una hoja con:<ul><li><b>Campo entero:</b> nuestro equipo o el rival con un sistema (4-2-3-1, 4-3-3, 4-4-2, 4-1-4-1, 3-5-2). Nosotros en nuestra mitad atacando hacia la derecha; el rival, en la suya.</li><li><b>F7:</b> 2-3-1, 3-2-1, 3-1-2 y 2-1-2-1.</li><li><b>⭐ Once de la J…:</b> si la jugada es para un partido (📅 arriba) y en Partidos tiene hecha la alineación, coloca ese once con su sistema y los dorsales de verdad.</li><li><b>Medio campo y área:</b> predefinidas: ataque 5 contra 4+1, presión tras pérdida, córner y falta lateral.</li><li><b>💾 Guardar esta colocación:</b> guarda cómo tienes las fichas ahora (los dos equipos y el balón) para ponerlas en otra jugada del mismo campo. Salen en «Mis colocaciones»; la ✕ la borra.</li></ul>Se coloca en el paso en el que estás. En una jugada de un solo paso sustituye a las fichas de ese equipo; con más pasos, mueve las que tienen el mismo número y deja las demás. <b>↶</b> lo deshace.`],
  ["🎤 Solo la explicación, moviendo a mano",`La forma más rápida si prefieres mover tú las fichas:<ol><li>Coloca las fichas del paso 1 arrastrándolas.</li><li>Pestaña <b>✨ Este paso</b> → <b>🎤</b> y di lo que pasa. Se guarda solo como explicación del paso: <b>no mueve nada</b>. Sale en la charla y al compartir.</li><li><b>+</b> en la línea de pasos, arrastra las fichas a donde van y vuelve a dictar.</li></ol>Si dictas otra vez, la explicación se cambia por la nueva (↶ la recupera).`],
  ["🗣️ Palabras para colocar las fichas",`Sirven en <b>✨ Este paso</b> con <b>Generar este paso</b>, sobre todo en el paso 1. Dorsal + dónde, separados por comas o «y»:<ul><li><b>Hacia delante o atrás:</b> arriba, en punta, en ataque · en el medio, centro del campo · atrás, en defensa (arriba = cerca de la portería rival).</li><li><b>De lado:</b> banda derecha, banda izquierda, por dentro, en el centro, carril derecho.</li><li><b>Sitios:</b> en el área, en la frontal, en el punto de penalti, primer palo, segundo palo, en el córner.</li><li><b>Junto a otro:</b> junto al 9, al lado del 4, detrás del 4, delante del 6, a la altura del 8.</li><li><b>Varios a la vez:</b> «el 8 y el 7 arriba», «el 8 y el 10 se ponen en la frontal».</li><li><b>Con balón:</b> «el 4 tiene el balón», «el 4 en el centro del campo con el balón».</li><li><b>Movimientos</b> (van al paso siguiente): avanza, sube, baja, retrocede, se desmarca, ataca el espacio, se mete, presiona.</li></ul>`],
  ["👉 Cómo se hace una jugada (el proceso)",`<ol><li><b>Paso 1 = cómo empieza.</b> En el cuadro de abajo, pestaña <b>✨ Este paso</b>, escribe o dicta con 🎤 «el 4 tiene el balón, el 8 y el 7 arriba» y pulsa <b>Generar este paso</b>. O colócalos a mano con las fichas de encima del campo.</li><li><b>Lo siguiente.</b> El cuadro cambia solo a <b>➕ Lo siguiente</b>: escribe o dicta lo que pasa después («el 4 la da al 8») y pulsa <b>Añadir paso</b>. Al dictar, el paso se añade solo al terminar de hablar.</li><li>Para cambiar un paso ya hecho, tócalo en la línea de pasos, pestaña <b>✨ Este paso</b>, cambia el texto y <b>Generar este paso</b>.</li><li>Repite para cada cosa que pase. Si una frase tiene dos acciones con balón, salen dos pasos.</li><li>Retoca arrastrando si quieres, <b>Reproducir</b> y <b>Compartir</b>.</li></ol>`],
  ["✨ Generar este paso",`Escribe qué pasa con <b>dorsales</b> o con los <b>nombres de tu plantilla</b> y pulsa <b>Generar este paso</b>: la app coloca y mueve las fichas desde el paso anterior. No hace falta poner a nadie antes: si un dorsal no está, lo pone; si ya lo has puesto tú, usa el tuyo.<ul><li>Primer paso: «el 7 saca de córner» o «el 4 tiene el balón».</li><li>«el 4 la da al 8», «el 9 se desmarca a la espalda», «el 7 centra al primer palo y el 9 ataca el primer palo», «el 9 remata».</li><li>Si pones dos cosas con el balón (un pase y un remate), la app hace dos pasos: el balón no puede hacer dos cosas a la vez.</li><li>Si cambias el texto, vuelve a pulsar <b>Generar este paso</b>: rehace las fichas del paso en el que estás, desde el anterior. También puedes dictarlo con 🎤.</li><li>Al dictar vale decir los números con palabras: «el cuatro la da al ocho».</li></ul>`],
  ["✨ Describir jugada (entera)",`En la lista de jugadas, <b>Describir jugada</b>: escribe toda la jugada, una frase por paso o seguida con comas, y la app la monta entera. Con la casilla marcada pone <b>rivales que reaccionan</b> (el portero va hacia el balón y los defensas acompañan). Tiene tres ejemplos para ver cómo escribirla.`],
  ["Qué palabras entiende",`<ul><li><b>Acciones:</b> la da, pasa, abre, descarga, cambia de juego, mete, prolonga, conduce, regatea, se desmarca, ataca, baja a recibir, centra, remata, dispara, saca.</li><li><b>Sitios:</b> banda derecha/izquierda, a la espalda, hacia dentro, entre líneas, frontal, primer y segundo palo, punto de penalti, en apoyo, al espacio.</li><li>Mejor frases cortas: <b>dorsal + acción + adónde</b>. Lo que no entiende te lo dice.</li></ul>`],
  ["Deshacer, rehacer y borrar",`En la línea de pasos, junto a la 🗑: <b>↶ Deshacer</b> (hasta 50 cambios: mover fichas, poner o quitar, generar, añadir o borrar pasos), y <b>↷ Rehacer</b>. La <b>🗑</b> borra el paso en el que estás.`],
  ["Reproducir y modo charla",`<b>▶ Reproducir</b> la anima entera: primero corren y luego sale el balón; los pases largos van por el aire. <b>◀ ▶</b> avanzan paso a paso mientras lo explicas. <b>Charla</b> la pone a pantalla completa con el texto en grande.`],
  ["Compartir",`El botón <b>compartir</b> (verde, a la derecha del reproductor, junto a ⛶) hace la animación (un GIF que WhatsApp acepta en Android y iPhone) y abre el menú del móvil para mandarla al grupo. Cada paso lleva su texto en grande. El botón de al lado (<b>1×</b>, 🐢 o ⚡) abre el menú de velocidad: <b>🐢 Lenta</b>, <b>Normal</b> o <b>⚡ Rápida</b>; vale también para Reproducir y se queda guardada.`],
  ["Se guarda sola",`Cada cambio se guarda solo en medio segundo (pone «✓ Guardada automáticamente»). Si la app se cierra o se recarga, vuelve a la jugada y al paso donde estabas. Las plantillas que solo abres para mirar no se guardan hasta que cambias algo.`],
  ["Jugadas para un partido",`En <b>Para el partido</b> la asignas a un partido y saldrá dentro de ese partido, para tenerla a mano en la charla.`]]},
 {ic:"📋",t:"Ejercicios",r:"Tu biblioteca de ejercicios dibujados en la pizarra.",a:[
  ["Crear un ejercicio",`<b>+ Nuevo ejercicio</b>: nombre, categoría, tiempo, espacio, jugadores, objetivo, desarrollo, consignas, variantes y fuente.`],
  ["Dibujarlo",`Elige el campo y usa las herramientas: jugadores blancos, rojos, portero y comodín, conos, balón, pase, carrera, conducción y texto. Arrastra con un dedo; <b>Deshacer</b> y <b>Vaciar pizarra</b> debajo.`],
  ["Buscar y filtrar",`Los ejercicios van <b>por tipo</b> (calentamiento, técnica, táctica, finalización…), cada uno en un grupo que se abre y se cierra tocándolo, con una línea de criterio debajo del nombre. La app recuerda cuáles dejas abiertos; <b>Abrir todo</b> y <b>Cerrar todo</b> los cambian de golpe. Arriba, el buscador y los filtros por lo que trabaja (presión, posesión, salida de balón…). <b>Duplicar</b> para hacer una variante, <b>Compartir</b> para pasarlo a otro entrenador.`],
  ["Las sesiones",`En <b>Entrenos → 📚 Sesiones</b> van agrupadas por lo que trabajan (presión, posesión, finalización…), según su nombre, su idea y sus ejercicios. Se filtran por <b>próximas</b> o <b>pasadas</b> y por <b>carga</b>, y el buscador mira también dentro de sus ejercicios.`]]},
 {ic:"📅",t:"Sesiones y entrenos",r:"El calendario de entrenos y las sesiones con sus ejercicios.",a:[
  ["Calendario",`Salen tus días de entreno (por defecto lunes y miércoles; se cambian con los botones L, M, X…) con el partido de cada semana al lado.`],
  ["Generar sesión",`En cada día, <b>Generar</b> monta una propuesta con tus ejercicios: calentamiento, juegos reducidos, partido y vuelta a la calma. Tiene en cuenta los días que faltan al partido (más carga lejos, menos la víspera), el informe del rival y lo que escribas en las indicaciones. Revísala y guárdala. Antes de generar puedes elegir <b>qué trabajar</b> (presión, posesión, salida de balón, finalización, transiciones, balón parado, físico), la <b>duración</b>, la <b>carga</b> y cuántos <b>jugadores</b> vas a tener, y escribir algo más. También está dentro de <b>Nueva sesión</b>: <b>✨ Generar</b>, al lado de «+ Añadir ejercicio», usa la fecha y la idea que hayas puesto.`],
  ["Un día suelto: extra o sin entreno",`Los <b>días fijos</b> (arriba, lu, mi…) son los de siempre. Se eligen arriba tocando los círculos <b>L M X J V S D</b>. Para una semana distinta: el <b>＋ Extra</b> de esa semana enseña los días libres; toca uno y se añade solo esa vez (sale marcado «Extra»), y la <b>✕</b> de un día lo quita solo ese día, por ejemplo un festivo («No hay entreno este día», con <b>↺ Volver a poner</b>). Los demás lunes o miércoles no cambian. Si ese día tenía sesión, la sesión no se borra: sigue en 📚 Sesiones.`],
  ["Elegir una sesión",`<b>Elegir</b> copia una sesión que ya tengas en ese día (la original no cambia).`],
  ["Ver y compartir una sesión",`Toca una sesión para verla con sus ejercicios y diagramas; desde ahí <b>Copiar texto</b>, <b>Compartir</b> o <b>Imprimir</b>.`]]},
 {ic:"⚽",t:"Partidos",r:"Todo lo de cada partido: convocatoria, alineación, resultado e informe.",a:[
  ["La lista",`Todos los partidos del calendario con su escudo, fecha y hora. El próximo sale marcado. Se actualiza sola cada día desde la federación (y los fines de semana por la tarde).`],
  ["Convocatoria",`Toca a cada chaval para convocarlo (avisa si pasas de 18). En <b>Datos del partido</b> pon la citación. <b>Imagen de la convocatoria</b> la hace lista para el grupo.`],
  ["Alineación",`Elige el sistema (4-2-3-1, 4-3-3, 4-4-2, 4-1-4-1, 3-5-2), toca cada hueco y elige al jugador. El banquillo se rellena solo. <b>Imagen de la alineación</b> y <b>Copiar texto</b>.`],
  ["Resultado",`Cuando se juega, el marcador y los goleadores llegan solos de la federación. <b>Imagen del resultado</b> con la clasificación de esa jornada. Si un goleador está mal, <b>Corregir goleadores</b>: lo tuyo manda.`],
  ["Informe del rival",`En cada partido, <b>Informe del rival</b>: puesto, puntos, goles a favor y en contra, sus resultados, cómo le va en casa o fuera, su goleador y su portero, y unas claves. Con imagen para compartir.`],
  ["Plantilla",`<b>Plantilla</b>: dorsal, foto, posición, capitán y bajas. Lo que cambies se queda aunque el club actualice la plantilla. Las fichas nuevas de la federación llegan solas marcadas «Nuevo».`],
  ["Estadísticas",`Por jugador: convocatorias, titularidades y goles; minutos del portero; y los máximos goleadores y porteros de toda la liga.`],
  ["Clasificación y equipos",`<b>Clasificación</b> con escudos y la tabla tras cada jornada. Toca un equipo para ver sus resultados, vuestros partidos y la foto de su campo (puedes poner tú la foto si no la hay).`]]},
 {ic:"🏠",t:"Mi club",r:"Tu club, tu equipo, copias de seguridad e instalar.",a:[
  ["Nombre y escudo",`Salen en la cabecera y en las imágenes. Solo se guardan en este móvil.`],
  ["Mi equipo",`Conectar con el código y la contraseña del equipo, <b>Actualizar ahora</b> para bajar lo último y <b>Desconectar</b>.`],
  ["Copias y pasar a otro móvil",`<b>Exportar todo</b> hace un archivo con tus ejercicios y sesiones; <b>Importar archivo</b> lo carga en otro móvil. En Partidos, <b>Exportar equipo</b> hace lo mismo con la plantilla y los partidos.`]]},
 {ic:"🔒",t:"Tus datos y privacidad",r:"Qué se guarda dónde.",a:[
  ["En tu móvil",`Tus ejercicios, sesiones, jugadas, convocatorias, alineaciones y lo que cambies en la plantilla se guardan <b>solo en este móvil</b>. Exporta una copia de vez en cuando.`],
  ["Lo que llega del club",`El calendario y los resultados son públicos (de la federación). La plantilla con fotos y los goleadores van <b>cifrados</b>: sin la contraseña del equipo nadie puede verlos.`]]},
 {ic:"❓",t:"Si algo no va",r:"Soluciones rápidas a lo más habitual.",a:[
  ["No me sale la versión nueva",`Ciérrala del todo y vuelve a abrirla con cobertura; a veces hay que abrirla dos veces.`],
  ["«Contraseña incorrecta»",`Revisa la contraseña del equipo en Mi club → Mi equipo (distingue mayúsculas).`],
  ["Compartir no abre el menú",`En algunos móviles sale la animación con su botón Compartir o Descargar; mantenla pulsada para guardarla.`],
  ["«Generar este paso» no entiende la frase",`Escríbela más sencilla: <b>dorsal + acción + adónde</b>, por ejemplo «el 8 la da al 7». Mira las palabras que entiende en la sección Pizarra.`]]}];
function htmlManual(){
  const q=nrm(S.manQ||""),ok=(a,b)=>!q||nrm(a+" "+b.replace(/<[^>]+>/g," ")).includes(q);
  const secc=MANUAL.map((s,i)=>{const items=s.a.filter(([t,h])=>ok(s.t+" "+t,h));if(q&&!items.length)return "";
    return `<details class="man" ${q||S.manAbierto==="todo"?"open":""}><summary><span class="manic">${s.ic}</span><span class="grow"><b>${esc(s.t)}</b><br><span class="note">${esc(s.r)}</span></span><span class="chev">›</span></summary>
      <div class="manin">${items.map(([t,h])=>`<details class="mani" ${q?"open":""}><summary>${esc(t)}<span class="chev">›</span></summary><div class="manbody">${h}</div></details>`).join("")}</div></details>`}).join("");
  return `<section class="form ses manual"><div class="bar" style="justify-content:flex-end;margin-bottom:0"><button class="btn sm" id="manTodo">Abrir todo</button><button class="btn sm" id="manNada">Cerrar todo</button></div>
    <input type="search" id="manQ" placeholder="Buscar en el manual (p. ej. compartir, convocatoria…)" value="${esc(S.manQ||"")}">
    ${secc||`<div class="note">No hay nada con «${esc(S.manQ)}».</div>`}</section>`}
document.addEventListener("focusin",e=>{if(e.target.matches("textarea,input[type=text],input[type=search]"))document.documentElement.classList.add("tecleando")});
document.addEventListener("focusout",()=>setTimeout(()=>{if(!document.activeElement?.matches?.("textarea,input[type=text],input[type=search]"))document.documentElement.classList.remove("tecleando")},50));
// ---------- Modo claro / oscuro (1.25): el botón de la cabecera; sin elegir, el del móvil ----------
function aplicarTema(){const t=LS.get("pizarra.tema",null);if(t)document.documentElement.dataset.theme=t;else delete document.documentElement.dataset.theme;
  const osc=t?t==="dark":matchMedia("(prefers-color-scheme: dark)").matches;$('meta[name="theme-color"]')?.setAttribute("content",osc?"#1a261e":"#15763a")}
aplicarTema();
$("#temaBtn").addEventListener("click",()=>{const osc=document.documentElement.dataset.theme?document.documentElement.dataset.theme==="dark":matchMedia("(prefers-color-scheme: dark)").matches;
  LS.set("pizarra.tema",osc?"light":"dark");aplicarTema();toast(osc?"☀️ Modo claro":"🌙 Modo oscuro")});
// ---------- Hoja de ayuda: manual y novedades ----------
function pintarAyuda(){const t=S.ayuda||"man";$("#ayudaSeg").dataset.t=t;
  document.querySelectorAll("#ayudaSeg button").forEach(b=>b.setAttribute("aria-selected",b.dataset.at===t));
  const nb=$('#ayudaSeg [data-at="nov"]');nb.innerHTML="✨ Novedades"+(LS.get("pizarra.novVista",null)!==VERSION?'<span class="nuevo">NUEVO</span>':"");
  $("#ayudaBody").innerHTML=t==="nov"?htmlNovedades():htmlManual();$("#ayudaBody").scrollTop=0;
  if(t==="nov"){LS.set("pizarra.novVista",VERSION);marcarAyuda()}}
function marcarAyuda(){const p=$("#ayudaPunto");if(p)p.hidden=LS.get("pizarra.novVista",null)===VERSION}
function abrirAyuda(t){S.ayuda=t||S.ayuda||"man";const h=$("#ayuda"),f=$("#ayudaFondo");pintarAyuda();h.hidden=f.hidden=false;
  document.documentElement.style.overflow="hidden";requestAnimationFrame(()=>requestAnimationFrame(()=>{h.classList.add("on");f.classList.add("on")}));
  try{history.pushState({ayuda:1},"")}catch(e){}}
function cerrarAyuda(desdeAtras){const h=$("#ayuda"),f=$("#ayudaFondo");if(h.hidden)return;h.classList.remove("on");f.classList.remove("on");
  document.documentElement.style.overflow="";setTimeout(()=>{h.hidden=f.hidden=true},320);if(!desdeAtras&&history.state&&history.state.ayuda)history.back()}
$("#ayudaBtn").addEventListener("click",()=>abrirAyuda(LS.get("pizarra.novVista",null)!==VERSION?"nov":S.ayuda));
$("#ayudaX").addEventListener("click",()=>cerrarAyuda());$("#ayudaFondo").addEventListener("click",()=>cerrarAyuda());
addEventListener("popstate",()=>cerrarAyuda(true));
addEventListener("keydown",e=>{if(e.key==="Escape")cerrarAyuda()});
$("#ayudaSeg").addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;S.ayuda=b.dataset.at;pintarAyuda()});
app.addEventListener("click",e=>{const b=e.target.closest("[data-ayuda]");if(b)abrirAyuda(b.dataset.ayuda)});
$("#ayuda").addEventListener("click",ev=>{const t=ev.target.closest("button");if(!t)return;
  if(t.id==="manTodo"){document.querySelectorAll("details.man,details.mani").forEach(d=>d.open=true)}
  if(t.id==="manNada"){document.querySelectorAll("details.man,details.mani").forEach(d=>d.open=false)}});
$("#ayuda").addEventListener("input",ev=>{if(ev.target.id!=="manQ")return;S.manQ=ev.target.value;const pos=ev.target.selectionStart;pintarAyuda();const i=$("#manQ");if(i){i.focus();i.setSelectionRange(pos,pos)}});
// arrastrar la hoja hacia abajo la cierra
(()=>{let y0=null;const h=$("#ayuda");
  h.addEventListener("touchstart",e=>{const enCab=e.target.closest(".asa,.shd");if(enCab||$("#ayudaBody").scrollTop<=0)y0=e.touches[0].clientY;else y0=null},{passive:true});
  h.addEventListener("touchmove",e=>{if(y0==null)return;const d=e.touches[0].clientY-y0;if(d>0){h.style.transition="none";h.style.transform=`translateY(${d}px)`}},{passive:true});
  h.addEventListener("touchend",e=>{if(y0==null)return;const d=e.changedTouches[0].clientY-y0;y0=null;h.style.transition="";h.style.transform="";if(d>110)cerrarAyuda()})})();

// ---------- Arranque ----------
(async()=>{
  aplicarClub();
  const db=crearDB(); S.db=db;
  if(!LS.get("pizarra.iniciada",false)&&!Object.keys(db.leer("ejercicios")).length){LS.set("pizarra.iniciada",true);await cargarEjemplos();LS.set("pizarra.ejemplosVer",2)}
  else setTimeout(()=>{S.ej=S.ej||{};ejemplosNuevos()},1500);
  let llegados=0;const listo=()=>{if(++llegados>=2&&S.view!=="edit"&&S.view!=="sesion")render()};
  db.collection("ejercicios").onSnapshot(snap=>{S.ej={};snap.docs.forEach(d=>S.ej[d.id]=d.data());if(llegados<2)listo();else if(S.view!=="edit"&&S.view!=="sesion")render()});
  db.collection("sesiones").onSnapshot(snap=>{S.se={};snap.docs.forEach(d=>S.se[d.id]=d.data());if(llegados<2)listo();else if(S.view!=="edit"&&S.view!=="sesion")render()});
  if("serviceWorker" in navigator){const habia=!!navigator.serviceWorker.controller;
    const editando=()=>["jugEdit","edit","sesion","jugador"].includes(S.view);
    // una recarga por versión nueva (antes solo una por sesión: la 2ª versión del día ya no entraba)
    const recargar=()=>{const ult=+sessionStorage.getItem("pizarra.recargada")||0;if(Date.now()-ult<15000)return;sessionStorage.setItem("pizarra.recargada",String(Date.now()));guardarJgYa();location.reload()};
    navigator.serviceWorker.addEventListener("controllerchange",()=>{if(!habia)return;if(!editando())return recargar();
      const espera=setInterval(()=>{if(!editando()){clearInterval(espera);recargar()}},2000)});
    navigator.serviceWorker.register("sw.js").then(r=>{r.update();
      // al volver a la app desde segundo plano, mira si hay versión nueva
      document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible")r.update().catch(()=>{})})}).catch(()=>{})}
  sincronizar();
  const vista=LS.get("pizarra.version",null);
  if(vista!==VERSION){LS.set("pizarra.version",VERSION);if(vista)setTimeout(()=>toast("Versión "+VERSION+": toca el ? de arriba para ver lo nuevo"),800);else LS.set("pizarra.novVista",VERSION)}
  marcarAyuda();
})();
</script>
