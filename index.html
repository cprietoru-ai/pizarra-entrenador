<!doctype html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b4a20">
<meta name="description" content="Pizarra para entrenadores de fútbol base: crea ejercicios dibujándolos en el campo y organízalos en sesiones. Gratis, sin cuentas y sin conexión.">

<title>Pizarra del Entrenador</title>

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@600;700&display=swap">
<style>
/* Layout: cabecera fija con pestañas; vista de lista en una columna en móvil y dos en escritorio; editor a pantalla completa. */
:root{
  --bg:#f3f4ee; --surface:#ffffff; --ink:#15261b; --muted:#5b6e60; --line:#d6ded4;
  --club:#0b4a20; --club-ink:#ffffff; --crema:#c79a12; --rojo:#d22f28; --pitch:#1f7a3c; --chip:#e8efe6;
  --display:"Bebas Neue",Impact,"Arial Narrow",sans-serif;
  --body:"Barlow","Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --label:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0d1610; --surface:#152219; --ink:#e7efe6; --muted:#9db3a2; --line:#2a3b2f;
  --club:#1b6a33; --club-ink:#ffffff; --crema:#f3e7a4; --rojo:#ff5a50; --pitch:#1d6e37; --chip:#1e3024; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0d1610; --surface:#152219; --ink:#e7efe6; --muted:#9db3a2; --line:#2a3b2f;
  --club:#1b6a33; --club-ink:#ffffff; --crema:#f3e7a4; --rojo:#ff5a50; --pitch:#1d6e37; --chip:#1e3024; color-scheme:dark}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
[hidden]{display:none!important}img{max-width:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.4;margin:0}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--club)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--crema);outline-offset:2px}
.wrap{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--club);color:var(--club-ink)}
.hd{display:flex;align-items:center;gap:12px;padding-block:10px}
.hd img{width:40px;height:40px;object-fit:contain;background:#fff;border-radius:50%;padding:3px}
.hd h1{font-family:var(--display);font-weight:400;font-size:30px;letter-spacing:1px;margin:0;line-height:1}
.hd .sub{font-family:var(--label);font-size:13px;letter-spacing:1.5px;opacity:.85;text-transform:uppercase}
.tabs{display:flex;gap:4px}
.tabs button{background:none;border:0;color:var(--club-ink);opacity:.75;font-family:var(--label);font-weight:700;font-size:16px;letter-spacing:1px;text-transform:uppercase;padding:10px 12px;border-bottom:3px solid transparent}
.tabs button[aria-selected="true"]{opacity:1;border-bottom-color:#f3e7a4}
main{padding-block:16px 40px;max-width:1100px;margin:0 auto}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:14px}
.bar .grow{flex:1 1 200px;min-width:0}
.btn{border:0;border-radius:8px;padding:9px 14px;font-weight:600;background:var(--chip);color:var(--ink)}
.btn.pri{background:var(--club);color:var(--club-ink)}
.btn.dan{background:transparent;color:var(--rojo);border:1.5px solid var(--rojo)}
.btn.sm{padding:6px 10px;font-size:14px}
input[type=text],input[type=date],input[type=search],select,textarea{width:100%;background:var(--surface);border:1.5px solid var(--line);border-radius:8px;padding:8px 10px}
textarea{min-height:76px;resize:vertical}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 11px;font-family:var(--label);font-weight:600;font-size:14px;letter-spacing:.5px}
.chip[aria-pressed="true"]{background:var(--club);color:var(--club-ink);border-color:var(--club)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.card{background:var(--surface);border:1.5px solid var(--line);border-radius:12px;overflow:hidden;display:flex;flex-direction:column;text-align:left;padding:0;min-width:0}
.card .dg{background:var(--pitch);aspect-ratio:16/10;display:flex;align-items:center;justify-content:center}
.card .dg svg{width:100%;height:100%}
.card .nodg{color:#cfe9d6;font-family:var(--display);font-size:28px;letter-spacing:1px}
.card .bd{padding:10px 12px;display:flex;flex-direction:column;gap:4px;min-width:0}
.card h3{font-family:var(--label);font-size:19px;font-weight:700;margin:0;line-height:1.15;text-wrap:balance}
.meta{display:flex;flex-wrap:wrap;gap:6px;font-size:13px;color:var(--muted)}
.tag{font-family:var(--label);font-weight:700;font-size:12px;letter-spacing:1px;text-transform:uppercase;color:var(--club);background:var(--chip);border-radius:4px;padding:1px 6px}
.empty{border:2px dashed var(--line);border-radius:12px;padding:28px;text-align:center;color:var(--muted)}
.empty b{display:block;color:var(--ink);font-size:17px;margin-bottom:4px}
.note{font-size:13px;color:var(--muted)}
.err{background:color-mix(in srgb,var(--rojo) 12%,var(--surface));border:1.5px solid var(--rojo);border-radius:8px;padding:8px 12px;margin-bottom:12px}
/* Editor */
.ed{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:18px;align-items:start}
@media (max-width:860px){.ed{grid-template-columns:minmax(0,1fr)}}
.board{background:var(--surface);border:1.5px solid var(--line);border-radius:12px;padding:10px;position:sticky;top:calc(env(safe-area-inset-top,0px) + 100px)}
@media (max-width:860px){.board{position:static}}
.board svg{width:100%;height:auto;display:block;background:var(--pitch);border-radius:8px;touch-action:none;user-select:none}
#edwrap{touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
.tools{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.tool{display:inline-flex;align-items:center;gap:6px;border:1.5px solid var(--line);background:var(--surface);border-radius:8px;padding:6px 9px;font-size:14px;font-weight:600}
.tool[aria-pressed="true"]{border-color:var(--club);background:var(--chip);box-shadow:inset 0 0 0 1.5px var(--club)}
.sw{width:14px;height:14px;border-radius:50%;display:inline-block;border:2px solid #0b4a20}
.clubgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),1fr));gap:14px;align-items:start}
.form{display:flex;flex-direction:column;gap:10px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:480px){.row{grid-template-columns:1fr}}
label{display:flex;flex-direction:column;gap:4px;font-family:var(--label);font-weight:700;font-size:13px;letter-spacing:1px;text-transform:uppercase;color:var(--muted)}
.back{background:none;border:0;color:var(--club);font-weight:700;padding:4px 0;margin-bottom:8px}
.confirm{display:inline-flex;gap:6px;align-items:center;flex-wrap:wrap}
/* Sesiones */
.ses{background:var(--surface);border:1.5px solid var(--line);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:6px;text-align:left;min-width:0}
.ses .top{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.ses h3{font-family:var(--display);font-weight:400;font-size:26px;letter-spacing:.5px;margin:0;line-height:1}
.carga{font-family:var(--label);font-weight:700;font-size:12px;letter-spacing:1px;text-transform:uppercase;padding:2px 8px;border-radius:999px;color:#fff;white-space:nowrap}
.c-alta{background:var(--rojo)}.c-media{background:#b98a00}.c-baja{background:#2f8f50}
.tl{display:flex;flex-direction:column;gap:8px;margin-top:8px}
.ti{display:grid;grid-template-columns:34px minmax(0,1fr) auto;gap:10px;align-items:center;background:var(--surface);border:1.5px solid var(--line);border-radius:10px;padding:8px 10px}
.ti .n{width:30px;height:30px;border-radius:50%;background:var(--rojo);color:#fff;display:flex;align-items:center;justify-content:center;font-family:var(--display);font-size:20px}
.ti .acts{display:flex;gap:4px}
.ti .acts button{border:1.5px solid var(--line);background:var(--surface);border-radius:6px;width:32px;height:32px;font-weight:700}
.picker{background:var(--surface);border:1.5px solid var(--club);border-radius:12px;padding:12px;margin-top:10px}
.picker .list{max-height:320px;overflow:auto;display:flex;flex-direction:column;gap:6px;margin-top:8px}
.picker .list button{text-align:left;background:var(--chip);border:0;border-radius:8px;padding:8px 10px}
/* Vista de sesión */
.vista h2{font-family:var(--display);font-weight:400;font-size:40px;letter-spacing:1px;margin:0;line-height:1;text-wrap:balance}
.vista .idea{font-family:var(--label);font-size:19px;font-weight:700;color:var(--club);border-left:5px solid var(--rojo);padding-left:10px;margin:8px 0 14px}
.tarea{background:var(--surface);border:1.5px solid var(--line);border-radius:12px;overflow:hidden;margin-bottom:14px}
.tarea .th{display:flex;gap:10px;align-items:center;background:var(--chip);padding:8px 12px}
.tarea .th h3{flex:1;margin:0;font-family:var(--label);font-size:20px;line-height:1.1}
.tarea .tb{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.2fr);gap:14px;padding:12px}
@media (max-width:700px){.tarea .tb{grid-template-columns:minmax(0,1fr)}}
.tarea .tb svg{width:100%;height:auto;border-radius:8px;background:var(--pitch)}
.kv{font-size:14px;margin:2px 0}.kv b{font-family:var(--label);letter-spacing:.5px;color:var(--club)}
.obj{background:color-mix(in srgb,var(--crema) 18%,var(--surface));border-left:4px solid var(--crema);padding:6px 10px;margin:6px 0;font-size:14px}
ul{margin:4px 0 4px 18px;padding:0}
.tot{font-variant-numeric:tabular-nums}
.toast{max-width:min(92vw,520px);text-align:center;position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:999px;font-weight:600;z-index:20}
@media print{header,.back,.bar .btn,.toast,body::before{display:none!important}body{background:#fff;color:#000}.tarea{break-inside:avoid;border-color:#bbb}main{padding:0}}
@media (prefers-reduced-motion:no-preference){.card,.ses{transition:transform .12s}.card:hover,.ses:hover{transform:translateY(-2px)}}
/* ==== PARTIDOS ==== */
.tabs{overflow-x:auto;scrollbar-width:none}.tabs::-webkit-scrollbar{display:none}
.tabs button{white-space:nowrap;flex:0 0 auto}
@media (max-width:480px){.tabs button{padding:10px 8px;font-size:15px;letter-spacing:.5px}}
.h2{font-family:var(--display);font-weight:400;font-size:34px;letter-spacing:.5px;margin:0;line-height:1.05;text-wrap:balance}
.h3{font-family:var(--label);font-size:21px;margin:0}
.filebtn{flex-direction:row;text-transform:none;letter-spacing:0;font-family:var(--body);font-size:15px;color:var(--ink);cursor:pointer}
.btn.pri.filebtn{color:var(--club-ink)}
.chk{flex-direction:row;align-items:center;gap:6px;text-transform:none;letter-spacing:0;font-family:var(--body);font-size:15px;color:var(--ink);font-weight:600}
.chk input{width:20px;height:20px}
.tag.rojo{background:var(--rojo);color:#fff}
.plist{display:flex;flex-direction:column;gap:8px}
.pcard{display:grid;grid-template-columns:42px 40px minmax(0,1fr) auto;gap:10px;align-items:center;background:var(--surface);border:1.5px solid var(--line);border-radius:12px;padding:8px 12px;text-align:left}
.pcard.next{border-color:var(--club);box-shadow:inset 0 0 0 1.5px var(--club)}
.pj{font-family:var(--display);font-size:24px;color:var(--club)}
.pesc{width:40px;height:40px;object-fit:contain;background:#fff;border-radius:50%;padding:3px;display:inline-block}
.pesc.big{width:64px;height:64px;flex:0 0 auto}
.pmid{min-width:0;overflow-wrap:anywhere}
.pres{font-family:var(--display);font-size:26px}
.phead{display:flex;gap:12px;align-items:center;margin-bottom:10px}
.datos{background:var(--surface);border:1.5px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:14px}
.datos summary{font-weight:700;cursor:pointer}
.blk{background:var(--surface);border:1.5px solid var(--line);border-radius:12px;padding:12px;margin-bottom:14px}
.ph{width:44px;height:44px;border-radius:50%;object-fit:cover;flex:0 0 auto;background:var(--chip);display:inline-flex;align-items:center;justify-content:center;font-family:var(--display);font-size:20px;color:var(--club)}
.ph.sm{width:38px;height:38px;font-size:17px}
.ph.big{width:96px;height:96px;font-size:36px}
.jgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:8px}
.jcard{display:flex;gap:10px;align-items:center;text-align:left;background:var(--surface);border:1.5px solid var(--line);border-radius:12px;padding:8px 10px;min-width:0}
.convgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:6px;margin-top:8px}
.cj{display:flex;gap:8px;align-items:center;text-align:left;border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 10px 4px 4px;font-family:var(--label);font-weight:700;font-size:15px;min-width:0}
.cj span:last-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cj[aria-pressed="true"]{background:var(--club);color:var(--club-ink);border-color:var(--club)}
.over{color:var(--rojo)!important;font-weight:700}
.campo11{position:relative;aspect-ratio:68/80;max-width:460px;margin:10px auto 0;background:var(--pitch);border-radius:10px;border:3px solid rgba(255,255,255,.6);
  background-image:radial-gradient(circle at 50% 0,transparent 15%,rgba(255,255,255,.55) 15.4%,transparent 16%),linear-gradient(transparent 88%,rgba(255,255,255,.08) 88%)}
.slot{position:absolute;transform:translate(-50%,-50%);background:none;border:0;padding:0;display:flex;flex-direction:column;align-items:center;gap:2px;width:76px}
.slot .ph{border:2.5px solid #fff}
.slot .vacio{background:rgba(0,0,0,.25);color:#fff;font-size:15px;border-style:dashed}
.slot.sel .ph{box-shadow:0 0 0 4px var(--crema)}
.sn{font-family:var(--label);font-weight:700;font-size:13px;color:#fff;text-shadow:0 1px 2px #000;max-width:76px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fcampo{display:block;width:100%;aspect-ratio:16/9;object-fit:cover;object-position:50% 60%;border-radius:10px;background:var(--chip)}
.tclas tr[data-eqc]{cursor:pointer}.eqc{display:inline-flex;align-items:center;gap:8px}.eqc img{width:26px;height:26px;object-fit:contain;background:#fff;border-radius:50%;padding:2px}
.tclas th,.tclas td{padding:6px 5px}
.tiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin-bottom:12px}.tiles div{background:var(--surface);border:1.5px solid var(--line);border-radius:12px;padding:10px;text-align:center}
.tiles b{display:block;font-family:var(--display);font-size:34px;font-weight:400;color:var(--club)}.tiles span{font-size:12px;color:var(--muted)}
@media (max-width:480px){.tiles{grid-template-columns:repeat(2,minmax(0,1fr))}}
.forma{display:flex;gap:6px;margin-top:6px}.fk{width:30px;height:30px;border-radius:6px;display:inline-flex;align-items:center;justify-content:center;color:#fff;font-family:var(--display);font-size:20px}
.fG{background:#2f8f50}.fE{background:#b98a00}.fP{background:var(--rojo)}
.semcab{margin:12px 0 2px;font-family:var(--label);letter-spacing:.5px}.pcard.dia{grid-template-columns:52px minmax(0,1fr) auto}.pcard.pasado{opacity:.6}
.pcard .acts{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}.lnk{background:none;border:0;padding:0;color:var(--club);font-weight:700;text-decoration:underline;text-align:left}
#jgwrap{touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
#jgwrap svg{width:100%;height:auto;display:block;border-radius:8px}
.jgpasos{margin-top:8px;align-items:center}
#jgwrap svg,.card .dg svg{border-radius:12px;box-shadow:0 8px 24px rgba(0,0,0,.25)}
@media (prefers-reduced-motion:no-preference){#jgwrap .halo{animation:halo 1.4s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
  #jgwrap .fl-pase{animation:corre 1s linear infinite}}
@keyframes halo{0%,100%{opacity:.55;transform:scale(.9)}50%{opacity:1;transform:scale(1.12)}}
@keyframes corre{to{stroke-dashoffset:-6}}
.jgprog{position:relative;height:6px;border-radius:3px;background:var(--line);margin:12px 6px 4px}
.jgprog i{position:absolute;left:0;top:0;bottom:0;width:var(--p);border-radius:3px;background:linear-gradient(90deg,var(--club),#2fbf63);transition:width .12s linear}
.jgprog b{position:absolute;top:50%;width:12px;height:12px;margin:-6px 0 0 -6px;border-radius:50%;background:var(--surface);border:2px solid var(--line)}
.jgprog b.on{background:#2fbf63;border-color:#2fbf63}.board.charla .jgpasos{display:none}
.jgtexto{min-height:2.6em;margin-top:8px;font-family:var(--label);font-weight:700;font-size:18px;line-height:1.25;text-align:center}
.board.charla{position:fixed;inset:0;z-index:40;border-radius:0;display:flex;flex-direction:column;justify-content:center;padding:max(12px,env(safe-area-inset-top)) 12px max(12px,env(safe-area-inset-bottom));background:#0b2e17}
.board.charla #jgwrap{max-height:72vh;display:flex;justify-content:center}.board.charla #jgwrap svg{max-height:72vh;width:auto;max-width:100%}
.board.charla .jgtexto{color:#fff;font-size:24px}.board.charla .tools,.board.charla>p{display:none}.board.charla .note{color:#cfe9d6}
.golgrid{display:flex;flex-direction:column;gap:6px;margin-top:8px}
.golrow{display:flex;align-items:center;gap:8px}.golrow .tot{min-width:22px;text-align:center}
.tstats{width:100%;border-collapse:collapse;font-size:15px}.tstats th,.tstats td{padding:6px 8px;border-bottom:1px solid var(--line);text-align:right}
.tstats th:first-child,.tstats td:first-child,.tstats .izq{text-align:left}.tstats tr.yo td{background:var(--chip);font-weight:700}
.imgov{position:fixed;inset:0;z-index:30;background:rgba(0,0,0,.75);display:flex;align-items:center;justify-content:center;padding:16px}
.imgbox{background:var(--surface);border-radius:12px;padding:12px;max-height:100%;overflow:auto;width:min(420px,100%)}
.imgbox img{width:100%;height:auto;display:block;border-radius:8px}
/* ==== /PARTIDOS ==== */
</style>

</head><body>
<header>
  <div class="wrap hd">
    <img id="clubImg" alt="Pizarra del Entrenador" src="icons/icon-192.png">
    <div><h1 id="clubName">Pizarra del Entrenador</h1><div class="sub" id="clubSub">Entrenos y partidos</div></div>
  </div>
  <nav class="wrap tabs" role="tablist">
    <button role="tab" id="tab-jg" aria-selected="true">Pizarra</button>
    <button role="tab" id="tab-ej" aria-selected="false">Ejercicios</button>
    <button role="tab" id="tab-se" aria-selected="false">Sesiones</button>
    <button role="tab" id="tab-pa" aria-selected="false">Partidos</button>
    <button role="tab" id="tab-club" aria-selected="false">Mi club</button>
  </nav>
</header>
<main class="wrap" id="app">
  <div class="empty" id="boot"><b>Cargando la pizarra…</b>Tus ejercicios y sesiones aparecerán aquí.</div>
</main>
<div class="toast" id="toast" hidden></div>

<script>
// ---------- Datos y estado ----------
const CATS = ["Calentamiento","Técnica","Táctica","Finalización","Físico","Balón parado","Partido","Vuelta a la calma","Charla"];
const CAMPOS = {rect:{w:40,h:30,n:"Espacio libre"}, f7:{w:60,h:40,n:"Campo F7"}, medio:{w:64,h:50,n:"Medio campo F11"}, area:{w:64,h:30,n:"Área"}, completo:{w:100,h:64,n:"Campo entero F11"}};
const CARGAS = ["Alta","Media-alta","Media","Baja-media","Baja"];
const S = {db:null, canWrite:true, ej:{}, se:{}, view:"jug", filtro:"Todas", q:"", editId:null, draft:null, tool:"mover", textoTool:"", sesId:null, picking:false, delConfirm:null, error:""};
const $ = (s,el=document)=>el.querySelector(s);
const esc = s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const app = $("#app");
function toast(t){const el=$("#toast");el.textContent=t;el.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(()=>el.hidden=true,2200)}
function minutos(t){ // "4 x 4'" -> 16, "20'" -> 20
  const s=String(t||"").replace(",","."); let m=s.match(/(\d+)\s*x\s*(\d+(?:\.\d+)?)/i); if(m) return (+m[1])*(+m[2]);
  m=s.match(/(\d+(?:\.\d+)?)/); return m?+m[1]:0 }
const ahora=()=>new Date().toISOString();

// ---------- Diagrama (coordenadas en metros) ----------
function lineasCampo(tipo,w,h){
  const L=(a,b,c,d)=>`<line x1="${a}" y1="${b}" x2="${c}" y2="${d}"/>`, R=(x,y,ww,hh)=>`<rect x="${x}" y="${y}" width="${ww}" height="${hh}" fill="none"/>`,
        C=(x,y,r)=>`<circle cx="${x}" cy="${y}" r="${r}" fill="none"/>`, G=(x,y,ww,hh)=>`<rect x="${x}" y="${y}" width="${ww}" height="${hh}" fill="#fff" fill-opacity=".85" stroke="none"/>`;
  let o=R(0,0,w,h);
  if(tipo==="f7") o+=L(w/2,0,w/2,h)+C(w/2,h/2,6)+R(0,h/2-12,12,24)+R(w-12,h/2-12,12,24)+G(-1.2,h/2-3,1.2,6)+G(w,h/2-3,1.2,6);
  else if(tipo==="completo") o+=L(w/2,0,w/2,h)+C(w/2,h/2,9.15)+R(0,h/2-20.15,16.5,40.3)+R(w-16.5,h/2-20.15,16.5,40.3)+R(0,h/2-9.15,5.5,18.3)+R(w-5.5,h/2-9.15,5.5,18.3)+G(-1.5,h/2-3.66,1.5,7.32)+G(w,h/2-3.66,1.5,7.32);
  else if(tipo==="medio") o+=`<path d="M${w/2-9.15},0 A9.15,9.15 0 0 0 ${w/2+9.15},0" fill="none"/>`+R(w/2-20.15,h-16.5,40.3,16.5)+R(w/2-9.15,h-5.5,18.3,5.5)+G(w/2-3.66,h,7.32,1.5);
  else if(tipo==="area") o+=R(w/2-20.15,h-16.5,40.3,16.5)+R(w/2-9.15,h-5.5,18.3,5.5)+G(w/2-3.66,h,7.32,1.5);
  return o }
function svgDiagrama(dg,{editable=false,preview=null,uid="d"}={}){
  const w=dg.w,h=dg.h,pad=Math.max(2,w*0.035),r=Math.max(0.9,w*0.02),fs=Math.max(1.1,w*0.024),sw=Math.max(0.12,w*0.0035);
  let ly="",ar="",pl="";
  const flecha=(k,x1,y1,x2,y2,op=1)=>{const col={pase:"#fff",carrera:"#ffd84a",conduccion:"#7fe0ff"}[k];
    const dash={pase:`stroke-dasharray="${r*0.9} ${r*0.6}"`,carrera:"",conduccion:`stroke-dasharray="${r*0.2} ${r*0.55}" stroke-linecap="round"`}[k];
    return `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="${col}" stroke-width="${k==="conduccion"?sw*3:sw*2.2}" ${dash} marker-end="url(#${uid}${k})" opacity="${op}"/>`};
  (dg.el||[]).forEach((el,i)=>{const k=el[0];
    if(k==="zona"){ly+=`<rect x="${el[1]}" y="${el[2]}" width="${el[3]}" height="${el[4]}" fill="#ffd84a" fill-opacity=".16" stroke="#ffd84a" stroke-opacity=".7" stroke-width="${sw}" stroke-dasharray="${r} ${r*.8}"/>`;
      if(el[5]) ly+=`<text x="${el[1]+el[3]/2}" y="${el[2]+fs*1.3}" font-size="${fs}" fill="#ffd84a" text-anchor="middle" font-family="Barlow Condensed,Arial Narrow,sans-serif" font-weight="700">${esc(el[5])}</text>`}
    else if(k==="pase"||k==="carrera"||k==="conduccion") ar+=flecha(k,el[1],el[2],el[3],el[4]);
    else if(k==="cono"){const c=r*.7;pl+=`<polygon data-i="${i}" points="${el[1]},${el[2]-c} ${el[1]-c*.85},${el[2]+c*.6} ${el[1]+c*.85},${el[2]+c*.6}" fill="#ff8a1f" stroke="#7a3a00" stroke-width="${sw*.6}"/>`}
    else if(k==="porteria_cono"){const c=r*.7;[-2,2].forEach(dx=>pl+=`<polygon points="${el[1]+dx},${el[2]-c} ${el[1]+dx-c*.85},${el[2]+c*.6} ${el[1]+dx+c*.85},${el[2]+c*.6}" fill="#ff8a1f" stroke="#7a3a00" stroke-width="${sw*.6}"/>`);
      ly+=`<line x1="${el[1]-2}" y1="${el[2]}" x2="${el[1]+2}" y2="${el[2]}" stroke="#ff8a1f" stroke-width="${sw*1.5}" stroke-dasharray="${r*.4} ${r*.4}"/>`}
    else if(k==="A"||k==="B"||k==="C"||k==="PT"){const [f,s,t]={A:["#fff","#0b4a20","#0b3a19"],B:["#e0322b","#fff","#fff"],C:["#ffd84a","#7a5a00","#3a2a00"],PT:["#111","#ffd84a","#ffd84a"]}[k];
      const lab=el[3]??(k==="PT"?"PT":"");
      pl+=`<circle cx="${el[1]}" cy="${el[2]}" r="${r}" fill="${f}" stroke="${s}" stroke-width="${sw*1.6}"/>`;
      if(lab) pl+=`<text x="${el[1]}" y="${el[2]+r*.38}" font-size="${r*1.05}" fill="${t}" text-anchor="middle" font-family="Bebas Neue,Impact,sans-serif">${esc(lab)}</text>`}
    else if(k==="balon") pl+=`<circle cx="${el[1]}" cy="${el[2]}" r="${r*.45}" fill="#fff" stroke="#111" stroke-width="${sw}"/>`;
    else if(k==="texto") ly+=`<text x="${el[1]}" y="${el[2]}" font-size="${fs}" fill="#fff" text-anchor="middle" font-family="Barlow Condensed,Arial Narrow,sans-serif" font-weight="700" paint-order="stroke" stroke="#0b3a19" stroke-width="${fs*.2}">${esc(el[3])}</text>`;
  });
  if(preview) ar+=flecha(preview[0],preview[1],preview[2],preview[3],preview[4],.7);
  const marks=["pase","carrera","conduccion"].map(k=>`<marker id="${uid}${k}" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="${{pase:"#fff",carrera:"#ffd84a",conduccion:"#7fe0ff"}[k]}"/></marker>`).join("");
  let rayas="";for(let i=0;i<8;i++) rayas+=`<rect x="${i*w/8}" y="0" width="${w/16}" height="${h}" fill="#fff" fill-opacity=".045"/>`;
  return `<svg viewBox="${-pad} ${-pad} ${w+2*pad} ${h+2*pad}" ${editable?'id="edsvg"':""} role="img" aria-label="Gráfico del ejercicio"><defs>${marks}</defs>
    <rect x="${-pad}" y="${-pad}" width="${w+2*pad}" height="${h+2*pad}" fill="#1f7a3c"/>${rayas}
    <g stroke="#fff" stroke-opacity=".75" stroke-width="${sw*1.4}">${lineasCampo(dg.tipo||"rect",w,h)}</g>${ly}${ar}${pl}</svg>` }

function leerForm(){

function redibujar(preview){ $("#edwrap").innerHTML=svgDiagrama(S.draft.diagrama,{editable:true,uid:"e",preview}) }
function snap(v){return Math.round(v*2)/2}
function punto(ev){const svg=$("#edsvg");const p=svg.createSVGPoint();p.x=ev.clientX;p.y=ev.clientY;const q=p.matrixTransform(svg.getScreenCTM().inverse());
  const {w,h}=S.draft.diagrama;return [Math.min(w,Math.max(0,snap(q.x))),Math.min(h,Math.max(0,snap(q.y)))]}
function cercano(x,y){const els=S.draft.diagrama.el,lim=Math.max(2,S.draft.diagrama.w*0.04);let best=-1,bd=1e9;
  els.forEach((el,i)=>{let d;if(["pase","carrera","conduccion"].includes(el[0])){const mx=(el[1]+el[3])/2,my=(el[2]+el[4])/2;d=Math.min(Math.hypot(x-mx,y-my),Math.hypot(x-el[1],y-el[2]),Math.hypot(x-el[3],y-el[4]))}
    else if(el[0]==="zona"){d=(x>=el[1]&&x<=el[1]+el[3]&&y>=el[2]&&y<=el[2]+el[4])?lim*.9:1e9} else d=Math.hypot(x-el[1],y-el[2]);
    if(d<bd){bd=d;best=i}});return bd<=lim?best:-1}
function guardarHist(){S.hist.push(JSON.stringify(S.draft.diagrama.el)); if(S.hist.length>50) S.hist.shift(); const b=$("#deshacer"); if(b) b.disabled=false}
let drag=null; // gesto en curso: {i} mover un elemento, {flecha,x,y} dibujar una flecha
function enlazarSvg(){
  // Los gestos se escuchan en #edwrap, que no se redibuja: el SVG de dentro sí se
  // regenera en cada movimiento, y si el gesto viviera en él el móvil lo perdería
  // a mitad y lo tomaría como desplazar la página.
  const wrap=$("#edwrap"); if(!wrap||!S.canWrite) return;
  const quieto=e=>{if(e.cancelable)e.preventDefault()};
  wrap.addEventListener("touchstart",quieto,{passive:false});
  wrap.addEventListener("touchmove",quieto,{passive:false});
  wrap.onpointerdown=ev=>{if(!$("#edsvg"))return;ev.preventDefault();try{wrap.setPointerCapture(ev.pointerId)}catch(e){}
    const [x,y]=punto(ev),t=S.tool;drag=null;
    if(t==="mover"){const i=cercano(x,y);if(i>=0&&!["pase","carrera","conduccion","zona"].includes(S.draft.diagrama.el[i][0])){guardarHist();drag={i}}}
    else if(["pase","carrera","conduccion"].includes(t)) drag={flecha:t,x,y};
    else if(t==="borrar"){const i=cercano(x,y);if(i>=0){guardarHist();S.draft.diagrama.el.splice(i,1);redibujar()}}
    else if(t==="texto"){const txt=($("#textoTool")?.value||"").trim();if(txt){guardarHist();S.draft.diagrama.el.push(["texto",x,y,txt]);redibujar()}else toast("Escribe primero el texto")}
    else {guardarHist();S.draft.diagrama.el.push([t,x,y]);redibujar()}};
  wrap.onpointermove=ev=>{if(!drag) return;ev.preventDefault();const [x,y]=punto(ev);
    if(drag.i!==undefined){const el=S.draft.diagrama.el[drag.i];el[1]=x;el[2]=y;redibujar()}
    else if(drag.flecha) redibujar([drag.flecha,drag.x,drag.y,x,y])};
  wrap.onpointerup=ev=>{if(drag&&drag.flecha){const [x,y]=punto(ev);if(Math.hypot(x-drag.x,y-drag.y)>=1.5){guardarHist();S.draft.diagrama.el.push([drag.flecha,drag.x,drag.y,x,y])}redibujar()}drag=null};
  wrap.onpointercancel=()=>{if(drag){drag=null;redibujar()}};
}
function montarEditor(){
  enlazarSvg();
  $("#volver").onclick=()=>{S.view="ej";render()};
  document.querySelectorAll("[data-tool]").forEach(b=>b.onclick=()=>{leerForm();S.tool=b.dataset.tool;render()});
  const tt=$("#textoTool"); if(tt) tt.oninput=()=>S.textoTool=tt.value;
  const dh=$("#deshacer"); if(dh) dh.onclick=()=>{const p=S.hist.pop();if(p){S.draft.diagrama.el=JSON.parse(p);redibujar()}dh.disabled=!S.hist.length};
  const lp=$("#limpiar"); if(lp) lp.onclick=()=>{guardarHist();S.draft.diagrama.el=[];redibujar()};
  const fc=$("#f-campo"); if(fc) fc.onchange=()=>{const c=CAMPOS[fc.value];S.draft.diagrama.tipo=fc.value;S.draft.diagrama.w=c.w;S.draft.diagrama.h=c.h;
    S.draft.diagrama.el=S.draft.diagrama.el.filter(el=>el[1]<=c.w&&el[2]<=c.h);redibujar()};
  const g=$("#guardar"); if(g) g.onclick=guardarEjercicio;
  const ce=$("#compEj"); if(ce) ce.onclick=()=>{leerForm();const e={...S.draft};compartir(nombreArchivo(e.nombre),paquete({[S.editId]:e},{}),"Ejercicio: "+e.nombre)};
  const du=$("#duplicar"); if(du) du.onclick=()=>{leerForm();S.editId=null;S.draft.nombre=S.draft.nombre+" (copia)";render();toast("Copia lista: cámbiala y guárdala")};
  const br=$("#borrar"); if(br) br.onclick=()=>{S.delConfirm=S.editId;leerForm();render()};
  const bn=$("#borrarNo"); if(bn) bn.onclick=()=>{S.delConfirm=null;leerForm();render()};
  const bs=$("#borrarSi"); if(bs) bs.onclick=borrarEjercicio;
}
async function guardarEjercicio(){
  leerForm(); const d=S.draft;

const LS={get(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}},
  set(k,v){try{localStorage.setItem(k,JSON.stringify(v));return true}catch(e){return false}}};
function crearDB(){
  const subs={ejercicios:[],sesiones:[]}, key=c=>"pizarra."+c, leer=c=>LS.get(key(c),{});
  const emitir=c=>{const m=leer(c);const snap={docs:Object.entries(m).map(([id,d])=>({id,data:()=>d}))};subs[c].forEach(f=>f(snap))};
  const doc=p=>{const [c,id]=p.split("/");return{
    async set(d){const m=leer(c);m[id]=d;if(!LS.set(key(c),m))throw{code:"quota_exceeded"};emitir(c)},
    async update(d){const m=leer(c);if(!m[id])throw{code:"not_found"};m[id]={...m[id],...d};LS.set(key(c),m);emitir(c)},
    async delete(){const m=leer(c);delete m[id];LS.set(key(c),m);emitir(c)}}};
  return {doc,leer,
    collection:c=>({onSnapshot(f){subs[c].push(f);setTimeout(()=>emitir(c),0);return()=>{}}}),
    fusionar(c,nuevos){const m=leer(c);Object.assign(m,nuevos);if(!LS.set(key(c),m))throw{code:"quota_exceeded"};emitir(c)},
    vaciar(){LS.set(key("ejercicios"),{});LS.set(key("sesiones"),{});emitir("ejercicios");emitir("sesiones")}};
}

function descargar(nombre,obj){const b=new Blob([JSON.stringify(obj,null,1)],{type:"application/json"});const u=URL.createObjectURL(b);
  const a=document.createElement("a");a.href=u;a.download=nombre;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),2000)}
async function compartir(nombre,obj,texto){
  try{const f=new File([JSON.stringify(obj)],nombre,{type:"application/json"});
    if(navigator.canShare&&navigator.canShare({files:[f]})){await navigator.share({files:[f],title:nombre,text:texto});return}}catch(e){if(e&&e.name==="AbortError")return}

async function importarTexto(txt){
  let d;try{d=JSON.parse(txt)}catch(e){toast("Ese archivo no es de la pizarra");return}
  if(!d||typeof d!=="object"||(!d.ejercicios&&!d.sesiones)){toast("Ese archivo no es de la pizarra");return}
  const ej={},se={};
  for(const [id,e] of Object.entries(d.ejercicios||{})) if(e&&typeof e.nombre==="string") ej[String(id).slice(0,80)]={...e,diagrama:e.diagrama&&Array.isArray(e.diagrama.el)?e.diagrama:null};
  for(const [id,s] of Object.entries(d.sesiones||{})) if(s&&typeof s.nombre==="string") se[String(id).slice(0,80)]={...s,tareas:Array.isArray(s.tareas)?s.tareas.map(String):[]};
  try{S.db.fusionar("ejercicios",ej);S.db.fusionar("sesiones",se);toast(`Importados ${Object.keys(ej).length} ejercicios y ${Object.keys(se).length} sesiones`)}
  catch(e){toast("No cabe más en este móvil: borra algo o exporta y limpia")}
}
async function cargarEjemplos(){try{const r=await fetch("ejemplos.json",{cache:"no-cache"});await importarTexto(await r.text())}catch(e){toast("No se pudieron cargar los ejemplos (¿sin conexión?)")}}
app.addEventListener("change",async ev=>{
  if(ev.target.id==="importar"&&ev.target.files[0]){await importarTexto(await ev.target.files[0].text());ev.target.value="";render()}
  if(ev.target.id==="c-escudo"&&ev.target.files[0]){const f=ev.target.files[0];const img=new Image();img.onload=()=>{const c=document.createElement("canvas"),k=Math.min(1,160/Math.max(img.width,img.height));
    c.width=Math.round(img.width*k);c.height=Math.round(img.height*k);c.getContext("2d").drawImage(img,0,0,c.width,c.height);S.club.escudo=c.toDataURL("image/png");URL.revokeObjectURL(img.src);render()};img.src=URL.createObjectURL(f)}
});
app.addEventListener("click",async ev=>{const t=ev.target.closest("button");if(!t||S.view!=="club")return;
  const v=id=>$("#"+id)?.value??"";
  if(t.id==="c-guardar"){S.club.nombre=v("c-nombre").trim();S.club.sub=v("c-sub").trim();LS.set("pizarra.club",S.club)?toast("Guardado"):toast("No se pudo guardar el escudo: prueba con una imagen más pequeña");aplicarClub();render()}
  if(t.id==="c-quitar"){S.club.escudo="";LS.set("pizarra.club",S.club);aplicarClub();render()}
  if(t.id==="exportar") compartir("pizarra-"+new Date().toISOString().slice(0,10)+".json",paquete(S.ej,S.se),"Copia de mi pizarra de entrenamientos");
  if(t.id==="ejemplos"){await cargarEjemplos();render()}
  if(t.id==="vaciar"){S.delConfirm="todo";render()}
  if(t.id==="vaciarNo"){S.delConfirm=null;render()}
  if(t.id==="vaciarSi"){S.db.vaciar();S.delConfirm=null;toast("Borrado");render()}
  if(t.id==="instalar"&&promptInstalar){promptInstalar.prompt();promptInstalar=null;render()}
});

  "3-5-2":[["POR",50,92],["DFC",24,72],["DFC",50,76],["DFC",76,72],["CI",10,47],["MC",31,52],["MP",50,40],["MC",69,52],["CD",90,47],["DC",35,18],["DC",65,18]]};

const hoyISO=()=>new Date().toISOString().slice(0,10);
const jugOrden=(a,b)=>(a[1].dorsal??99)-(b[1].dorsal??99)||(a[1].corto||"").localeCompare(b[1].corto||"");
const slugPA=t=>(t||"x").normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/[^\w]+/g,"-").replace(/^-|-$/g,"").toLowerCase().slice(0,40);
const nomJ=j=>j?(j.corto||j.nombre||"?"):"";
function partidosOrden(){return Object.entries(S.eq.partidos).sort((a,b)=>(a[1].fecha||"9").localeCompare(b[1].fecha||"9")||(a[1].jornada||0)-(b[1].jornada||0))}
function proximo(){const h=hoyISO();return (partidosOrden().find(([,p])=>(p.fecha||"")>=h&&!p.resultado)||[])[0]}
function fotoHtml(j,cls="ph"){return j&&j.foto?`<img class="${cls}" src="${j.foto}" alt="">`:`<span class="${cls} sinfoto">${esc(j&&j.dorsal!=null?j.dorsal:"·")}</span>`}
function escudoClub(){return S.eq.escudo||$("header .hd img")?.src||""}
function nombreClub(){return S.eq.club||(S.club&&S.club.nombre)||$("header h1")?.textContent.replace(/^Pizarra\s*/,"")||"Mi equipo"}

    <div class="row" style="margin-top:8px"><label>Capitán<select id="paCapitan"><option value="">—</option>${[...enOnce].filter(id=>J[id]).map(id=>`<option value="${esc(id)}" ${capitanDe(p)===id?"selected":""}>${esc(nomJ(J[id]))}</option>`).join("")}</select></label></div>

    <p class="note" style="text-align:center">Si no se comparte, mantén pulsada la imagen para guardarla.</p></div></div>`:""}`;
}
function escudoHtml(p,izq){const nuestro=izq===!!p.casa, src=nuestro?escudoClub():p.escudo_rival;return src?`<img class="pesc big" src="${src}" alt="">`:`<span class="pesc big"></span>`}
function capitanDe(p){const ids=Object.values(p.once||{});if(p.capitan&&ids.includes(p.capitan))return p.capitan;return ids.find(id=>S.eq.jugadores[id]?.capitan)||""}

async function importarEquipo(txt){
  let d;try{d=JSON.parse(txt)}catch(e){toast("Ese archivo no es de un equipo");return}
  const e=d&&d.tipo==="equipo"&&d.equipo;if(!e||typeof e!=="object"){toast("Ese archivo no es de un equipo");return}
  fusionarEquipo(e);
  if(eqGuardar()) toast(`Equipo importado: ${Object.keys(e.jugadores||{}).length} jugadores y ${Object.keys(e.partidos||{}).length} partidos`);
}
function fusionarEquipo(e){
  const eq=S.eq;
  for(const k of ["club","categoria","lema","escudo"]) if(typeof e[k]==="string"&&e[k]) eq[k]=e[k];
  for(const [id0,j] of Object.entries(e.jugadores||{})){if(!j||!(j.corto||j.nombre))continue;
    const id=String(id0).slice(0,60),prev=eq.jugadores[id],n={...prev,...j};
    if(prev){
      // Un dato vacío que llega nunca borra uno puesto en el móvil
      for(const k of Object.keys(j)) if((j[k]==null||j[k]==="")&&prev[k]!=null&&prev[k]!=="") n[k]=prev[k];
      // Y lo que el entrenador ha cambiado a mano se queda como él lo dejó
      for(const k of prev.editados||[]){if(prev[k]===undefined)delete n[k];else n[k]=prev[k]}
      if(prev.editados) n.editados=prev.editados}
    eq.jugadores[id]=n}
  for(const [id,p] of Object.entries(e.partidos||{})){if(!p||typeof p!=="object")continue;const prev=eq.partidos[id]||{};
    // Lo del entrenador (convocatoria, once, capitán, citación) no se pisa al reimportar el calendario
    eq.partidos[String(id).slice(0,60)]={...p,...pick(prev,["convocados","once","sistema","capitan","citacion","goles_manual","propia_manual"]),resultado:p.resultado||prev.resultado||""}}
  Object.assign(eq.campos,e.campos||{});
}

// Todo sale de los datos del grupo que ya tiene la app: resultados de todos, clasificación,
// goleadores y porteros de la liga. Se calcula en el momento, con lo que haya ese día.
function codRival(p){const G=S.eq.grupo||{};return Object.keys(G).find(c=>c!==S.eq.cod&&G[c].nombre===p.rival)||""}
const r1=x=>(Math.round(x*10)/10).toLocaleString("es-ES");
function informeRival(p){
  const c=codRival(p);if(!c) return null;
  const G=S.eq.grupo||{},R=(S.eq.resultados||[]).filter(r=>r[1]===c||r[2]===c).sort((a,b)=>a[0]-b[0]);
  const fila=tablaHasta().find(x=>x.cod===c)||null,st=S.eq.stats||{};
  const part=R.map(([j,l,v,gl,gv])=>{const en=l===c,mi=en?gl:gv,su=en?gv:gl;return {j,casa:en,rival:(en?v:l),mi,su,k:mi>su?"G":mi===su?"E":"P"}});
  const lado=part.filter(x=>x.casa===!p.casa);  // cómo le va donde se juega: en su casa si vamos fuera
  const sum=a=>a.reduce((x,y)=>x+y,0),pj=part.length;
  const gol=(st.liga_goleadores||[]).filter(g=>g.cod===c),por=(st.liga_porteros||[]).filter(g=>g.cod===c)[0];
  const ida=Object.entries(S.eq.partidos).find(([id,q])=>q!==p&&q.rival===p.rival&&q.resultado);
  const inf={cod:c,nombre:G[c]?.nombre||p.rival,fila,part,pj,gf:sum(part.map(x=>x.mi)),gc:sum(part.map(x=>x.su)),lado,
    ladoTxt:p.casa?"fuera de casa":"en su campo",ladoG:lado.filter(x=>x.k==="G").length,goleador:gol[0]||null,golesTop:gol.slice(0,3),portero:por||null,ida:ida?ida[1]:null,claves:[]};
  const K=inf.claves,gfpp=pj?inf.gf/pj:0,gcpp=pj?inf.gc/pj:0;
  if(!pj) K.push("Todavía no ha jugado: no hay datos para el informe.");
  else{
    if(gcpp>=2) K.push(`Encaja mucho (${r1(gcpp)} por partido): presión arriba y llegar con gente al área.`);
    else if(gcpp<=1) K.push(`Encaja poco (${r1(gcpp)} por partido): paciencia con balón, no perderla en zona de riesgo.`);
    if(gfpp>=2.5) K.push(`Marca mucho (${r1(gfpp)} por partido): cuidar las transiciones defensivas y las vigilancias.`);
    if(inf.goleador&&inf.goleador.goles>=3) K.push(`Su goleador lleva ${inf.goleador.goles} goles: vigilancia sobre él.`);
    if(lado.length) K.push(`${inf.ladoTxt[0].toUpperCase()+inf.ladoTxt.slice(1)} ha ganado ${inf.ladoG} de ${lado.length}.`);
    const ult=part.slice(-3).map(x=>x.k).join("");if(ult==="GGG")K.push("Llega en racha: tres victorias seguidas.");else if(!ult.includes("G")&&ult.length===3)K.push("Llega sin ganar en sus tres últimos partidos.");
    if(inf.ida){const m=marcador(inf.ida);if(m)K.push(`En la ida: ${inf.ida.resultado} (${m.mios>m.suyos?"ganamos":m.mios<m.suyos?"perdimos":"empate"}).`)}}
  return inf}

S.dias=(()=>{try{return JSON.parse(localStorage.getItem("pizarra.dias"))||[1,3]}catch(e){return [1,3]}})();
const isoDe=d=>new Date(d.getTime()-d.getTimezoneOffset()*6e4).toISOString().slice(0,10);
function diasEntreno(desde,semanas){const out=[],d=new Date(desde+"T12:00:00");for(let i=0;i<semanas*7;i++){if(S.dias.includes(d.getDay()))out.push(isoDe(d));d.setDate(d.getDate()+1)}return out}
function partidoTras(fecha){return partidosOrden().find(([id,p])=>p.fecha&&p.fecha>fecha&&(new Date(p.fecha)-new Date(fecha))/864e5<=8)}

// Reglas (las del skill entrenamientos-durcal): calentamiento tipo FIFA 11+, juegos reducidos con
// series cortas, más carga lejos del partido y menos la víspera, y el foco según el rival.
function generarSesion(fecha,indic){
  const px=partidoTras(fecha),p=px&&px[1],inf=p&&informeRival(p),dias=p?Math.round((new Date(p.fecha)-new Date(fecha))/864e5):9;
  const alta=dias>=5,foco=[],temas=[];
  if(inf&&inf.pj){const gc=inf.gc/inf.pj,gf=inf.gf/inf.pj;
    if(gc>=2){foco.push("presi","robo","pressing");temas.push("Presión arriba")}
    if(gf>=2.5){foco.push("defens","repliegue","transici","vigilan");temas.push("Defender las transiciones")}
    if(gc<=1){foco.push("posesi","rondo","paciencia","salida");temas.push("Posesión con paciencia")}}
  if(!alta){foco.push("finaliz","tiro","balón parado","córner","falta");if(!temas.length)temas.push("Finalización y balón parado")}
  const extra=(indic||"").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").split(/[^a-zñ]+/).filter(w=>w.length>3);
  if(extra.length) temas.unshift((indic||"").split(/[.;,\n]/)[0].trim().replace(/^./,c=>c.toUpperCase()));
  const norm=t=>(t||"").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"");
  const previa=Object.values(S.se).filter(s=>s.fecha&&s.fecha<fecha).sort((a,b)=>b.fecha.localeCompare(a.fecha))[0],usadas=new Set(previa?previa.tareas||[]:[]);
  const nota=(id,e)=>{const txt=norm([e.nombre,e.objetivo,e.descripcion,e.fuente].join(" "));let n=0;
    for(const k of foco) if(txt.includes(norm(k))) n+=3; for(const k of extra) if(txt.includes(k)) n+=4;
    if(usadas.has(id)) n-=2; return n+Math.random()*.5};
  const huecos=alta?[["Calentamiento"],["Técnica","Táctica"],["Táctica","Finalización"],["Partido"],["Vuelta a la calma"]]
                   :[["Calentamiento"],["Técnica","Finalización"],["Balón parado","Finalización"],["Partido"],["Vuelta a la calma"]];
  const elegidos=[];
  for(const cats of huecos){const c=Object.entries(S.ej).filter(([id,e])=>cats.includes(e.categoria)&&!elegidos.includes(id)).sort((a,b)=>nota(b[0],b[1])-nota(a[0],a[1]))[0];if(c) elegidos.push(c[0])}
  const d=new Date(fecha+"T12:00:00"),dia=DIAS_N[d.getDay()];
  const tema=temas[0]||(alta?"Juego y presión":"Activación y finalización");
  return {fecha,nombre:dia[0].toUpperCase()+dia.slice(1)+" · "+tema,carga:alta?"Alta":"Baja",tareas:elegidos,
    idea:inf&&inf.claves.length?inf.claves[0]:tema,
    notas:`Propuesta generada ${p?`para el partido contra ${p.rival} (${dias} días antes)`:"sin partido esa semana"}: ${alta?"sesión de carga, la más lejos del partido":"víspera: menos volumen y más velocidad de decisión"}.${indic?" Indicaciones: "+indic:""} Revísala y cambia lo que quieras.`}
}

// ---------- Equipo conectado (1.5) ----------
// Con código y contraseña, la app baja sola de este mismo sitio:
//   equipos/<código>/calendario.json   público, lo actualiza cada día la tarea del repo
//   equipos/<código>/plantilla.enc.json   jugadores y fotos, cifrado (AES-GCM, clave PBKDF2)
// Lo del entrenador (convocatorias, onces, citaciones) no se pisa nunca.
const CONEX_KEY="pizarra.conexion";
S.conex=(()=>{try{return JSON.parse(localStorage.getItem(CONEX_KEY))||null}catch(e){return null}})();
function conexGuardar(){try{S.conex?localStorage.setItem(CONEX_KEY,JSON.stringify(S.conex)):localStorage.removeItem(CONEX_KEY)}catch(e){}}
const b64=x=>Uint8Array.from(atob(x),c=>c.charCodeAt(0));
async function descifrar(r,clave){
  const base=await crypto.subtle.importKey("raw",new TextEncoder().encode(clave),"PBKDF2",false,["deriveKey"]);
  const k=await crypto.subtle.deriveKey({name:"PBKDF2",hash:"SHA-256",salt:b64(r.sal),iterations:r.iter},base,{name:"AES-GCM",length:256},false,["decrypt"]);
  const gz=await crypto.subtle.decrypt({name:"AES-GCM",iv:b64(r.iv)},k,b64(r.datos));
  return JSON.parse(await new Response(new Blob([gz]).stream().pipeThrough(new DecompressionStream("gzip"))).text());
}
let sincronizando=null;
async function sincronizar({forzar=false,avisar=false}={}){
  const c=S.conex; if(!c) return false;
  if(sincronizando) return sincronizando;
  if(!forzar&&c.ultima&&Date.now()-c.ultima<10*60*1000&&S.eq.resultados&&c.version===VERSION) return true;
  sincronizando=(async()=>{
    const dir="equipos/"+encodeURIComponent(c.equipo)+"/";
    try{
      const rc=await fetch(dir+"calendario.json",{cache:"no-store"});
      if(rc.status===404){c.error="No existe ese equipo";return false}
      const cal=await rc.json();
      fusionarEquipo({club:cal.club,categoria:cal.categoria,escudo:cal.escudo,partidos:cal.partidos});
      if(Array.isArray(cal.clasificacion)) S.eq.clasificacion=cal.clasificacion;
      if(Array.isArray(cal.resultados)) S.eq.resultados=cal.resultados;
      if(cal.equipos) S.eq.grupo=cal.equipos;
      if(cal.cod_equipo) S.eq.cod=cal.cod_equipo;
      try{const rj=await fetch(dir+"jugadas.json",{cache:"no-store"});if(rj.ok){const jj=await rj.json();if(jj&&jj.jugadas)S.eq.jugadasClub=jj.jugadas}}catch(e){}
      const rp=await fetch(dir+"plantilla.enc.json",{cache:"no-store"});
      if(rp.ok){const r=await rp.json();
        if(forzar||r.exportado!==c.plantilla){
          let pl;try{pl=await descifrar(r,c.clave)}catch(e){c.error="Contraseña incorrecta";eqGuardar();return false}

// ---------- Jugadas animadas (1.9) ----------
// Una jugada son fichas (nuestros, rivales, porteros) y un balón en varios pasos. Entre un paso y
// el siguiente la app deduce el movimiento: carrera (se mueve sin balón), conducción (se mueve con
// el balón) o pase (el balón cambia de jugador). Se guardan en este móvil (localStorage).
const JV=["jug","jugEdit"];
const JUG_KEY="pizarra.jugadas";
S.jug=(()=>{try{return JSON.parse(localStorage.getItem(JUG_KEY))||{}}catch(e){return {}}})();
function jugGuardar(){try{localStorage.setItem(JUG_KEY,JSON.stringify(S.jug));return true}catch(e){toast("No cabe en este móvil");return false}}
const CAMPOS_JUG={completo:"Campo entero",medio:"Medio campo",area:"Área",f7:"Campo F7"};
const FICHA_COL={A:["#fff","#0b4a20","#0b3a19"],B:["#e0322b","#fff","#fff"],PT:["#ffd84a","#0b4a20","#0b3a19"],PR:["#111","#e0322b","#fff"]};
// Plantillas para empezar (metros: medio campo 64x50 con la portería abajo; campo entero 100x64 atacando a la derecha)
function jugPlantillas(){

// Las de balón parado se ven mejor en el área (64x30): se bajan 20 m las del medio campo
function aArea(j){j.campo="area";for(const p of j.pasos){for(const id in p.pos)p.pos[id]=[p.pos[id][0],p.pos[id][1]-20];if(p.balon&&p.balon.xy)p.balon.xy=[p.balon.xy[0],p.balon.xy[1]-20]}return j}
function jugDims(j){const c=CAMPOS[j.campo]||CAMPOS.completo;return [c.w,c.h]}
function bPos(j,k){const p=j.pasos[k];if(!p||!p.balon)return null;if(p.balon.con&&p.pos[p.balon.con]){const q=p.pos[p.balon.con];return [q[0]+0.9,q[1]+0.9]}return p.balon.xy||null}
// Movimientos entre el paso k-1 y el k
function movimientos(j,k){
  if(k<1)return [];const a=j.pasos[k-1],b=j.pasos[k],out=[];
  for(const f of j.fichas){const p=a.pos[f.id],q=b.pos[f.id];if(!p||!q)continue;
    if(Math.hypot(q[0]-p[0],q[1]-p[1])>0.8) out.push({t:(a.balon?.con===f.id&&b.balon?.con===f.id)?"conduccion":"carrera",id:f.id,p,q})}
  const bp=bPos(j,k-1),bq=bPos(j,k);
  if(bp&&bq&&!(a.balon?.con&&a.balon.con===b.balon?.con)&&Math.hypot(bq[0]-bp[0],bq[1]-bp[1])>0.8) out.push({t:"pase",p:bp,q:bq});
  return out}
function ondulada(p,q,amp){const L=Math.hypot(q[0]-p[0],q[1]-p[1]),n=Math.max(3,Math.round(L/2.2)),ux=(q[0]-p[0])/L,uy=(q[1]-p[1])/L;let d=`M${p[0]},${p[1]}`;
  for(let i=1;i<=n;i++){const t=i/n,s=(i===n?0:(i%2?1:-1))*amp;d+=` L${p[0]+ux*L*t-uy*s},${p[1]+uy*L*t+ux*s}`}return d}
// Dibujo: posiciones del paso k, o a mitad de camino hacia k+1 con anim (0..1)
function svgJugada(j,k,{anim=null,uid="j",ghost=true,sel=null,editable=false}={}){
  const [w,h]=jugDims(j),pad=Math.max(2,w*.035),r=Math.max(1.3,w*.022),sw=Math.max(.12,w*.0035),fs=r*1.05;
  const ease=t=>t<.5?2*t*t:1-Math.pow(-2*t+2,2)/2,e=anim==null?0:ease(anim);
  const k2=anim==null?k:Math.min(k+1,j.pasos.length-1);
  const pos=id=>{const a=j.pasos[k].pos[id],b=j.pasos[k2].pos[id];if(!a)return b;if(!b||anim==null)return a;return [a[0]+(b[0]-a[0])*e,a[1]+(b[1]-a[1])*e]};
  let fl="",gh="",pl="",tr="";
  const col={carrera:"#ffd84a",conduccion:"#5fe3ff",pase:"#fff"};
  // Cada flecha con un halo suave debajo para que destaque sobre el césped
  const flecha=(m,op)=>{const d=m.t==="conduccion"?ondulada(m.p,m.q,r*.45):`M${m.p[0]},${m.p[1]} L${m.q[0]},${m.q[1]}`,dash=m.t==="pase"?`stroke-dasharray="${r*.8} ${r*.55}"`:"";
    return `<path d="${d}" fill="none" stroke="${col[m.t]}" stroke-opacity=".22" stroke-width="${sw*7}" stroke-linecap="round" stroke-linejoin="round" opacity="${op}"/>
      <path class="fl fl-${m.t}" d="${d}" fill="none" stroke="${col[m.t]}" stroke-width="${sw*(m.t==="conduccion"?2.8:2.6)}" stroke-linecap="round" stroke-linejoin="round" ${dash} marker-end="url(#${uid}${m.t})" opacity="${op}"/>`};
  if(anim==null&&ghost&&k>0) for(const m of movimientos(j,k)){fl+=flecha(m,.95);
    if(m.id){const f=j.fichas.find(x=>x.id===m.id),[c1,c2]=FICHA_COL[f.t];gh+=`<circle cx="${m.p[0]}" cy="${m.p[1]}" r="${r}" fill="${c1}" stroke="${c2}" stroke-width="${sw*1.4}" opacity=".3"/>`}}
  if(anim!=null) for(const m of movimientos(j,k2)){fl+=flecha(m,.3+.6*e);
    // estela: del punto de salida hasta donde va ahora
    if(m.id){const q=pos(m.id);tr+=`<line x1="${m.p[0]}" y1="${m.p[1]}" x2="${q[0]}" y2="${q[1]}" stroke="${col[m.t]}" stroke-opacity=".55" stroke-width="${r*.9}" stroke-linecap="round"/>`}}
  // Rivales debajo y los nuestros encima, para que siempre se lean nuestros dorsales
  const conB=(anim!=null&&e>.5?j.pasos[k2]:j.pasos[k]).balon?.con;
  for(const f of [...j.fichas].sort((a,b)=>"B PR".includes(b.t)-"B PR".includes(a.t))){const q=pos(f.id);if(!q)continue;const [c1,c2,c3]=FICHA_COL[f.t];
    if(f.id===conB) pl+=`<circle class="halo" cx="${q[0]}" cy="${q[1]}" r="${r*1.55}" fill="#ffd84a" fill-opacity=".18" stroke="#ffd84a" stroke-opacity=".8" stroke-width="${sw*1.4}"/>`;
    pl+=`<g data-f="${f.id}" filter="url(#${uid}sh)"><circle cx="${q[0]}" cy="${q[1]}" r="${r}" fill="url(#${uid}g${f.t})" stroke="${sel===f.id?"#ffd84a":c2}" stroke-width="${sel===f.id?sw*3.5:sw*1.6}"/>${f.lab?`<text x="${q[0]}" y="${q[1]+r*.38}" font-size="${fs*(String(f.lab).length>2?.62:1)}" fill="${c3}" text-anchor="middle" font-family="Bebas Neue,Impact,sans-serif">${esc(f.lab)}</text>`:""}</g>`}
  // Balón: en un pase viaja de un sitio a otro; si no, va con su jugador
  let b=bPos(j,k);if(anim!=null){const b2=bPos(j,k2),a=j.pasos[k].balon,c=j.pasos[k2].balon;
    if(a?.con&&a.con===c?.con){const q=pos(a.con);b=[q[0]+.9,q[1]+.9]}
    else if(b&&b2){const b0=b;b=[b0[0]+(b2[0]-b0[0])*e,b0[1]+(b2[1]-b0[1])*e];
      // estela del balón en el pase
      for(let i=1;i<=4;i++){const ee=Math.max(0,e-i*.06);pl+=`<circle cx="${b0[0]+(b2[0]-b0[0])*ee}" cy="${b0[1]+(b2[1]-b0[1])*ee}" r="${r*.5*(1-i*.15)}" fill="#fff" opacity="${.35-i*.07}"/>`}}}
  if(b) pl+=`<circle data-f="balon" cx="${b[0]}" cy="${b[1]}" r="${r*.52}" fill="url(#${uid}gbal)" stroke="#111" stroke-width="${sw*1.1}" filter="url(#${uid}sh)"/>`;
  const marks=["pase","carrera","conduccion"].map(t=>`<marker id="${uid}${t}" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="${col[t]}"/></marker>`).join("");
  let rayas="";for(let i=0;i<10;i++) rayas+=`<rect x="${i*w/10}" y="${-pad}" width="${w/20}" height="${h+2*pad}" fill="#fff" fill-opacity=".05"/>`;
  const grad=(id,a,b)=>`<radialGradient id="${uid}g${id}" cx="35%" cy="30%" r="75%"><stop offset="0" stop-color="${a}"/><stop offset="1" stop-color="${b}"/></radialGradient>`;
  const defs=marks+`<linearGradient id="${uid}cesped" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2c9d4f"/><stop offset="1" stop-color="#17652f"/></linearGradient>
    <radialGradient id="${uid}vin" cx="50%" cy="50%" r="70%"><stop offset=".6" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".35"/></radialGradient>
    <filter id="${uid}sh" x="-50%" y="-50%" width="200%" height="200%"><feDropShadow dx="0" dy="${r*.22}" stdDeviation="${r*.22}" flood-color="#000" flood-opacity=".45"/></filter>
    ${grad("A","#ffffff","#dfe9e0")}${grad("PT","#ffe680","#e8b800")}${grad("B","#ff6a5e","#c11d16")}${grad("PR","#3a3a3a","#0a0a0a")}${grad("bal","#ffffff","#cfcfcf")}`;
  return `<svg viewBox="${-pad} ${-pad} ${w+2*pad} ${h+2*pad}" ${editable?'id="jgsvg"':""} xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Jugada"><defs>${defs}</defs>
    <rect x="${-pad}" y="${-pad}" width="${w+2*pad}" height="${h+2*pad}" fill="url(#${uid}cesped)"/>${rayas}
    <g stroke="#fff" stroke-opacity=".8" stroke-width="${sw*1.4}" fill="none">${lineasCampo(j.campo,w,h)}</g>
    <rect x="${-pad}" y="${-pad}" width="${w+2*pad}" height="${h+2*pad}" fill="url(#${uid}vin)"/>${tr}${fl}${gh}${pl}</svg>`}

  ${S.img?`<div class="imgov" role="dialog" aria-label="Archivo"><div class="imgbox"><img src="${S.img.url}" alt="">
    <div class="bar" style="justify-content:center;margin-top:10px"><button class="btn pri" id="jgCompartir">Compartir</button><button class="btn" id="jgBajar">Descargar</button><button class="btn" id="jgCerrar">Cerrar</button></div></div></div>`:""}`;
}
function abrirJugada(id,plantilla){
  const base=plantilla&&typeof plantilla==="object"?structuredClone(plantilla):plantilla?structuredClone(jugPlantillas()[plantilla]):id?structuredClone(S.jug[id]):{nombre:"",campo:"medio",fichas:[],pasos:[{texto:"",pos:{},balon:null}]};
  S.jgId=plantilla?null:id;S.jgDraft=base;S.jgPaso=0;S.jgSel=null;S.jgTool="mover";S.jgPlay=false;S.jgCharla=false;S.img=null;S.delConfirm=null;S.view="jugEdit";render();window.scrollTo(0,0)}
function leerJg(){const j=S.jgDraft,v=id=>$("#"+id);if(!v("jg-nombre"))return;j.nombre=v("jg-nombre").value.trim();j.partido=v("jg-partido").value||null;j.pasos[S.jgPaso].texto=v("jg-texto").value.trim()}
function redibujarJg(){const w=$("#jgwrap");if(w) w.innerHTML=svgJugada(S.jgDraft,S.jgPaso,{uid:"e",sel:S.jgSel,editable:true})}

// ---------- Gestos en la pizarra de jugadas (un dedo, como la de ejercicios) ----------
let jgDrag=null;
function montarJug(){
  const wrap=$("#jgwrap");if(!wrap||!S.canWrite)return;
  const quieto=e=>{if(e.cancelable)e.preventDefault()};
  wrap.addEventListener("touchstart",quieto,{passive:false});wrap.addEventListener("touchmove",quieto,{passive:false});
  const pto=ev=>{const svg=$("#jgsvg"),p=svg.createSVGPoint();p.x=ev.clientX;p.y=ev.clientY;const q=p.matrixTransform(svg.getScreenCTM().inverse()),[w,h]=jugDims(S.jgDraft);
    return [Math.min(w+1.5,Math.max(-1.5,Math.round(q.x*2)/2)),Math.min(h+1.5,Math.max(-1.5,Math.round(q.y*2)/2))]};
  const cerca=(x,y)=>{const P=S.jgDraft.pasos[S.jgPaso],lim=Math.max(2.2,jugDims(S.jgDraft)[0]*.035);let best=null,bd=1e9;
    const b=bPos(S.jgDraft,S.jgPaso);if(b){const d=Math.hypot(x-b[0],y-b[1]);if(d<bd&&d<=lim*.8){bd=d;best="balon"}}
    for(const f of S.jgDraft.fichas){const q=P.pos[f.id];if(!q)continue;const d=Math.hypot(x-q[0],y-q[1]);if(d<bd&&d<=lim){bd=d;best=f.id}}return best};
  wrap.onpointerdown=ev=>{if(S.jgPlay||!$("#jgsvg"))return;ev.preventDefault();try{wrap.setPointerCapture(ev.pointerId)}catch(e){}
    const [x,y]=pto(ev),t=S.jgTool,j=S.jgDraft,P=j.pasos[S.jgPaso];jgDrag=null;
    if(t==="mover"){const c=cerca(x,y);if(c){jgDrag={id:c,x0:x,y0:y,movido:false}}else{S.jgSel=null;redibujarJg()}}
    else if(t==="balon"){const c=cerca(x,y);P.balon=c&&c!=="balon"?{con:c}:{xy:[x,y]};redibujarJg()}
    else{const id="f"+Date.now().toString(36)+Math.random().toString(36).slice(2,4),nn=j.fichas.filter(f=>f.t===t).length+1;
      j.fichas.push({id,t,lab:t==="A"?String(nn+1):t==="PT"?"1":""});for(const p of j.pasos) p.pos[id]=[x,y];redibujarJg()}};
  wrap.onpointermove=ev=>{if(!jgDrag)return;ev.preventDefault();const [x,y]=pto(ev),P=S.jgDraft.pasos[S.jgPaso];
    if(Math.hypot(x-jgDrag.x0,y-jgDrag.y0)>.6) jgDrag.movido=true;if(!jgDrag.movido)return;
    if(jgDrag.id==="balon") P.balon={xy:[x,y]}; else P.pos[jgDrag.id]=[x,y];redibujarJg()};
  wrap.onpointerup=ev=>{if(!jgDrag)return;const d=jgDrag;jgDrag=null;const P=S.jgDraft.pasos[S.jgPaso];
    if(d.id==="balon"&&d.movido){const [x,y]=pto(ev);let c=null,bd=2.4;for(const f of S.jgDraft.fichas){const q=P.pos[f.id];if(!q)continue;const dd=Math.hypot(x-q[0],y-q[1]);if(dd<bd){bd=dd;c=f.id}}
      P.balon=c?{con:c}:{xy:[x,y]}}
    else if(!d.movido&&d.id!=="balon"){leerJg();S.jgSel=d.id;render();return}
    redibujarJg()};
  wrap.onpointercancel=()=>{jgDrag=null;redibujarJg()};
}

// ---------- Reproducción y vídeo ----------
const JG_T=850; // ms por paso
function reproducir(){
  const j=S.jgDraft;if(j.pasos.length<2)return toast("Añade al menos dos pasos");
  if(S.jgPaso>=j.pasos.length-1) S.jgPaso=0;
  S.jgPlay=true;render();let t0=null;
  const tick=ts=>{if(!S.jgPlay)return;if(t0==null)t0=ts;const a=Math.min(1,(ts-t0)/JG_T),w=$("#jgwrap");
    if(w) w.innerHTML=svgJugada(j,S.jgPaso,{uid:"e",anim:a});
    const pr=$("#jgprog");if(pr) pr.style.setProperty("--p",((S.jgPaso+a)/(j.pasos.length-1)*100).toFixed(1)+"%");
    if(a>=1){S.jgPaso++;const tx=$("#jgtexto");if(tx)tx.textContent=j.pasos[S.jgPaso].texto||"";t0=null;
      if(S.jgPaso>=j.pasos.length-1){S.jgPlay=false;setTimeout(render,500);return}
      return setTimeout(()=>requestAnimationFrame(tick),420)}
    requestAnimationFrame(tick)};
  setTimeout(()=>requestAnimationFrame(tick),300)}
const svgImg=svg=>new Promise((ok,ko)=>{const i=new Image();i.onload=()=>ok(i);i.onerror=ko;i.src="data:image/svg+xml;charset=utf-8,"+encodeURIComponent(svg)});
async function fotograma(x,W,H,j,k,anim,texto){
  x.fillStyle="#0b4a20";x.fillRect(0,0,W,H);
  const im=await svgImg(svgJugada(j,k,{uid:"v",anim,ghost:anim==null}));const [w,h]=jugDims(j),ar=(w*1.07)/(h*1.07+0.001),bh=H-150*W/1280,bw=Math.min(W-40*W/1280,bh*ar),bh2=bw/ar;
  x.drawImage(im,(W-bw)/2,20+(bh-bh2)/2,bw,bh2);
  const k_=W/1280;x.fillStyle="#fff";x.font=`600 ${30*k_}px "Barlow Condensed","Arial Narrow",sans-serif`;x.textAlign="center";
  const pal=(texto||"").split(" ");let l="",ls=[];for(const p of pal){const tt=l?l+" "+p:p;if(x.measureText(tt).width>W-80){ls.push(l);l=p}else l=tt}ls.push(l);
  ls.slice(0,3).forEach((t,i)=>x.fillText(t,W/2,H-110*k_+i*36*k_));
  x.fillStyle="#f3e7a4";x.font=`400 ${26*k_}px "Bebas Neue",Impact,sans-serif`;x.textAlign="left";x.fillText((j.nombre||"JUGADA").toUpperCase(),24*k_,H-14*k_);
  x.textAlign="right";x.fillText(nombreClub().toUpperCase(),W-24*k_,H-14*k_)}
// Animación GIF: WhatsApp la acepta en Android y en iPhone y la repite sola. Se hace fotograma a
// fotograma (no en tiempo real), así que sale igual de suave en cualquier móvil.
async function grabarGif(){
  const j=S.jgDraft;if(j.pasos.length<2){toast("Añade al menos dos pasos");return null}
  const {GIFEncoder,quantize,applyPalette}=await import("./lib/gifenc.esm.js");
  try{await document.fonts.load('400 26px "Bebas Neue"')}catch(e){}
  const W=720,H=496,c=document.createElement("canvas");c.width=W;c.height=H;const x=c.getContext("2d",{willReadFrequently:true}),gif=GIFEncoder();
  const frame=async(k,anim,texto,delay)=>{await fotograma(x,W,H,j,k,anim,texto);const d=x.getImageData(0,0,W,H).data,pal=quantize(d,128,{format:"rgb444"});
    gif.writeFrame(applyPalette(d,pal,"rgb444"),W,H,{palette:pal,delay})};
  const N=10;
  await frame(0,null,j.pasos[0].texto,1000);
  for(let k=0;k<j.pasos.length-1;k++){for(let i=1;i<N;i++) await frame(k,i/N,j.pasos[k+1].texto,Math.round(JG_T/N));
    await frame(k+1,null,j.pasos[k+1].texto,k===j.pasos.length-2?2200:950)}
  gif.finish();return new Blob([gif.bytes()],{type:"image/gif"})}

// ---------- Acciones ----------
app.addEventListener("click",async ev=>{const t=ev.target.closest("button");if(!t)return;
  if(t.dataset.jgp){abrirJugada(t.dataset.jgp);return}
  if(!JV.includes(S.view))return;
  if(t.id==="jgNueva"){abrirJugada(null);return}
  if(t.dataset.jg){abrirJugada(t.dataset.jg);return}
  if(t.dataset.jgclub){const o=S.eq.jugadasClub[t.dataset.jgclub];if(o){abrirJugada(null,o);toast("Jugada del club: puedes cambiarla y guardarla como tuya")}return}
  if(t.dataset.jgplant){abrirJugada(null,t.dataset.jgplant);toast("Plantilla abierta: cámbiala y guárdala como tuya");return}
  if(S.view!=="jugEdit")return;
  const j=S.jgDraft;
  if(t.id==="jgVolver"){S.jgPlay=false;S.view="jug";S.img=null;render();return}
  if(t.dataset.jt){leerJg();S.jgTool=t.dataset.jt;S.jgSel=null;render();return}
  if(t.dataset.jpaso){leerJg();S.jgPaso=+t.dataset.jpaso;S.jgSel=null;render();return}
  if(t.id==="jgMasPaso"){leerJg();const p=structuredClone(j.pasos[S.jgPaso]);p.texto="";j.pasos.splice(S.jgPaso+1,0,p);S.jgPaso++;S.jgSel=null;render();toast("Paso nuevo: arrastra las fichas a donde van");return}
  if(t.id==="jgBorrarPaso"){j.pasos.splice(S.jgPaso,1);S.jgPaso=Math.max(0,S.jgPaso-1);render();return}
  if(t.id==="jgIni"){S.jgPlay=false;leerJg();S.jgPaso=0;render();return}
  if(t.id==="jgAnt"){S.jgPlay=false;leerJg();S.jgPaso=Math.max(0,S.jgPaso-1);render();return}
  if(t.id==="jgSig"){S.jgPlay=false;leerJg();S.jgPaso=Math.min(j.pasos.length-1,S.jgPaso+1);render();return}
  if(t.id==="jgPlay"){if(S.jgPlay){S.jgPlay=false;render()}else{leerJg();S.jgSel=null;reproducir()}return}
  if(t.id==="jgCharla"){leerJg();S.jgCharla=!S.jgCharla;render();if(S.jgCharla)window.scrollTo(0,0);return}
  if(t.id==="jgQuitar"){const id=S.jgSel;j.fichas=j.fichas.filter(f=>f.id!==id);for(const p of j.pasos){delete p.pos[id];if(p.balon?.con===id){const q=bPos(j,0);p.balon=null}}S.jgSel=null;render();return}
  if(t.id==="jgDesel"){leerJg();S.jgSel=null;render();return}
  if(t.id==="jgGuardar"){leerJg();if(!j.nombre){toast("Ponle nombre a la jugada");$("#jg-nombre")?.focus();return}
    const id=S.jgId||("jg-"+Date.now().toString(36));S.jug[id]={...j,actualizado:ahora()};if(jugGuardar()){S.jgId=id;toast("Jugada guardada")}render();return}
  if(t.id==="jgBorrar"){S.delConfirm="jg";render();return}
  if(t.id==="jgBorrarNo"){S.delConfirm=null;render();return}
  if(t.id==="jgBorrarSi"){delete S.jug[S.jgId];jugGuardar();S.delConfirm=null;S.view="jug";render();toast("Jugada borrada");return}
  if(t.id==="jgGif"){leerJg();t.disabled=true;t.textContent="Preparando…";
    try{const blob=await grabarGif();if(!blob){render();return}
      const nombre=slugPA(j.nombre||"jugada")+".gif",f=new File([blob],nombre,{type:"image/gif"});
      if(navigator.canShare&&navigator.canShare({files:[f]})){try{await navigator.share({files:[f],title:j.nombre||"Jugada"});render();return}catch(e){if(e&&e.name==="AbortError"){render();return}}}
      S.img={blob,url:URL.createObjectURL(blob),nombre}}  // sin menú de compartir directo: se enseña con su botón
    catch(e){toast("No se pudo hacer la animación")}render();return}
  if(t.id==="jgCerrar"){URL.revokeObjectURL(S.img.url);S.img=null;render();return}
  if(t.id==="jgBajar"){bajarBlob(S.img.blob,S.img.nombre);return}
  if(t.id==="jgCompartir"){try{const f=new File([S.img.blob],S.img.nombre,{type:S.img.blob.type});
      if(navigator.canShare&&navigator.canShare({files:[f]})){await navigator.share({files:[f]});return}}catch(e){if(e&&e.name==="AbortError")return}
    bajarBlob(S.img.blob,S.img.nombre);toast("Descargado");return}
});
app.addEventListener("change",ev=>{const t=ev.target;if(S.view!=="jugEdit")return;const j=S.jgDraft;
  if(t.id==="jg-campo"){leerJg();j.campo=t.value;const [w,h]=jugDims(j);for(const p of j.pasos){for(const id in p.pos){const q=p.pos[id];p.pos[id]=[Math.min(w,q[0]),Math.min(h,q[1])]}}render();return}
  if(t.id==="jg-lab"){const f=j.fichas.find(x=>x.id===S.jgSel);if(f){f.lab=t.value.trim();redibujarJg()}return}
  if(t.id==="jg-labpl"&&t.value){const f=j.fichas.find(x=>x.id===S.jgSel);if(f){f.lab=t.value;const i=$("#jg-lab");if(i)i.value=t.value;redibujarJg()}return}
});
app.addEventListener("input",ev=>{if(S.view==="jugEdit"&&ev.target.id==="jg-texto"){S.jgDraft.pasos[S.jgPaso].texto=ev.target.value;const tx=$("#jgtexto");if(tx)tx.textContent=ev.target.value}});

// ---------- Arranque ----------
(async()=>{
  aplicarClub();
  const db=crearDB(); S.db=db;
  if(!LS.get("pizarra.iniciada",false)&&!Object.keys(db.leer("ejercicios")).length){LS.set("pizarra.iniciada",true);await cargarEjemplos()}
  let llegados=0;const listo=()=>{if(++llegados>=2&&S.view!=="edit"&&S.view!=="sesion")render()};
  db.collection("ejercicios").onSnapshot(snap=>{S.ej={};snap.docs.forEach(d=>S.ej[d.id]=d.data());if(llegados<2)listo();else if(S.view!=="edit"&&S.view!=="sesion")render()});
  db.collection("sesiones").onSnapshot(snap=>{S.se={};snap.docs.forEach(d=>S.se[d.id]=d.data());if(llegados<2)listo();else if(S.view!=="edit"&&S.view!=="sesion")render()});
  if("serviceWorker" in navigator){const habia=!!navigator.serviceWorker.controller;
    navigator.serviceWorker.addEventListener("controllerchange",()=>{if(habia&&!sessionStorage.getItem("pizarra.recargada")){sessionStorage.setItem("pizarra.recargada","1");location.reload()}});
    navigator.serviceWorker.register("sw.js").then(r=>r.update()).catch(()=>{})}
  sincronizar();
  const vista=LS.get("pizarra.version",null);
  if(vista!==VERSION){LS.set("pizarra.version",VERSION);if(vista){const n=NOVEDADES[0][2][0];setTimeout(()=>toast("Novedades de la versión "+VERSION+": "+n),800)}}
})();
