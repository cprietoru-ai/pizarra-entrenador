# Cada día baja de la RFAF el calendario y los resultados de los equipos
# conectados (equipos/*/config.json) y los sube si han cambiado.
name: Calendario RFAF
on:
  schedule:
    - cron: "17 6 * * *"   # 6:17 UTC: 7:17 u 8:17 en España
    - cron: "17 19 * * 6,0"   # sábado y domingo por la tarde, para los resultados del finde
  workflow_dispatch:
permissions:
  contents: write
jobs:
  calendario:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pillow cryptography
      - run: python3 -I scripts/calendario_rfaf.py
      - name: Fichas nuevas y goleadores (cifrado)
        env:
          PIZARRA_CLAVE: ${{ secrets.PIZARRA_CLAVE }}
        run: python3 -I scripts/equipo_privado.py
      - name: Subir si hay cambios
        run: |
          git config user.name "calendario-rfaf"
          git config user.email "actions@users.noreply.github.com"
          git add equipos
          git diff --cached --quiet || (git commit -m "Calendario RFAF $(date -u +%F)" && git push)
